<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: IS; src: url(/local/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2) }
  @font-face { font-family: ISerif; font-style: italic; src: url(/local/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) }
  :root { --ink: #1a1511; --lime: #c6f648; --paper: #f3f1ec; --muted: #a39d8f }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); font-family: IS; color: var(--paper) }
  .glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(198,246,72,.16), transparent 55%) }
  .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center }
  .title { font-size: 104px; line-height: 1.04; font-weight: 600; letter-spacing: -.035em; animation: rise .8s cubic-bezier(.2,.8,.2,1) .2s both }
  em { font-family: ISerif; font-style: italic; font-weight: 400; letter-spacing: 0; position: relative; display: inline-block }
  em::after { content: ''; position: absolute; left: 0; right: 0; bottom: .02em; height: .1em; background: var(--lime); transform-origin: left; animation: draw .5s cubic-bezier(.6,0,.2,1) .9s both }
  .sub { margin-top: 30px; font-size: 32px; color: var(--muted); animation: fade .6s ease-out 1.1s both }
  .mark { height: 64px; margin: 0 auto 56px; display: block; animation: fade .6s ease-out both }
  @keyframes rise { from { opacity: 0; transform: translateY(50px) } to { opacity: 1; transform: none } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes draw { from { transform: scaleX(0) } to { transform: scaleX(1) } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="center"><div>
    <img class="mark" src="/local/docs/brand/lockup-on-dark.svg" alt="">
    <div class="title">Watch an app<br>get <em>designed.</em></div>
    <div class="sub">One prompt, recorded in one take.</div>
  </div></div>
</body>
</html>
