<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: IS; src: url(/local/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2) }
  @font-face { font-family: ISerif; font-style: italic; src: url(/local/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) }
  :root { --ink: #1a1511; --lime: #c6f648; --paper: #f3f1ec; --muted: #a39d8f }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: IS; color: var(--paper) }
  .glow { position: absolute; inset: 0; background: radial-gradient(circle at 50% 62%, rgba(198,246,72,.18), transparent 50%) }
  /* Act 1: the prompt */
  .act1 { position: absolute; inset: 0; padding: 0 80px; display: flex; flex-direction: column; justify-content: center; animation: out .4s ease-in 4.6s both }
  .kicker { font-size: 44px; font-weight: 600; color: var(--lime); animation: fade .4s ease-out .1s both }
  .box { margin-top: 36px; background: #2b2521; border-radius: 40px; padding: 48px; font-size: 54px; line-height: 1.25; min-height: 330px; box-shadow: 0 30px 80px rgba(0,0,0,.4); animation: rise .6s cubic-bezier(.2,.8,.2,1) .2s both }
  .caret { display: inline-block; width: 4px; height: 56px; background: var(--lime); vertical-align: -8px; margin-left: 4px; animation: blink 1s steps(1) infinite }
  .send { margin-top: 30px; align-self: flex-end; background: var(--lime); color: var(--ink); font-weight: 600; font-size: 40px; padding: 22px 40px; border-radius: 999px; animation: press .3s ease-out 4.1s both }
  /* Act 2: the app */
  .head { position: absolute; left: 0; right: 0; top: 150px; text-align: center; animation: rise .7s cubic-bezier(.2,.8,.2,1) 5s both }
  .head h1 { margin: 0; font-size: 112px; line-height: 1; font-weight: 600; letter-spacing: -.035em }
  em { font-family: ISerif; font-style: italic; font-weight: 400; letter-spacing: 0; position: relative; display: inline-block }
  em::after { content: ''; position: absolute; left: 0; right: 0; bottom: .02em; height: .1em; background: var(--lime); transform-origin: left; animation: draw .5s cubic-bezier(.6,0,.2,1) 5.6s both }
  .head p { margin: 22px 0 0; font-size: 40px; color: var(--muted) }
  .stage { position: absolute; left: 0; right: 0; top: 520px; height: 1320px; animation: stage .9s cubic-bezier(.2,.8,.2,1) 5.1s both }
  .main { left: 50%; top: 0; transform: translateX(-50%) scale(1.42); transform-origin: top center; z-index: 3 }
  .side { top: 150px; opacity: .5 }
  .l { left: -150px; transform: rotate(-8deg) }
  .r { right: -150px; transform: rotate(8deg) }
  .s2 { animation: slide .5s cubic-bezier(.6,0,.2,1) 7.6s both }
  .s3 { animation: slide .5s cubic-bezier(.6,0,.2,1) 9.4s both }
  .s4 { animation: slide .5s cubic-bezier(.6,0,.2,1) 11.2s both }
  .label { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 38px; color: var(--muted); animation: fade .4s 6s both }
  /* Act 3: the end */
  .end { position: absolute; inset: 0; background: var(--ink); display: grid; place-items: center; text-align: center; animation: fade .5s ease-out 13s both }
  .end img { height: 84px; display: block; margin: 0 auto 70px }
  .end h2 { margin: 0; font-size: 104px; line-height: 1.05; font-weight: 600; letter-spacing: -.035em }
  .end p { margin: 40px 0 0; font-size: 42px; color: var(--muted) }
  @keyframes rise { from { opacity: 0; transform: translateY(70px) } to { opacity: 1; transform: none } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes out { to { opacity: 0; transform: translateY(-80px) } }
  @keyframes draw { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @keyframes blink { 50% { opacity: 0 } }
  @keyframes press { 0% { transform: scale(1) } 50% { transform: scale(.92) } 100% { transform: scale(1) } }
  @keyframes stage { from { opacity: 0; transform: translateY(260px) } to { opacity: 1; transform: none } }
  @keyframes slide { from { transform: translateX(100%) } to { transform: none } }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="act1">
    <div class="kicker">{{KICKER}}</div>
    <div class="box"><span id="typed"></span><span class="caret"></span></div>
    <div class="send">Design it ↑</div>
  </div>

  <div class="head">
    <h1>{{HEAD}}<br><em>{{TAG}}</em></h1>
    <p>{{SUB}}</p>
  </div>
  <div class="stage">
    <div class="device side l" data-src="{{LEFT}}" data-start="5100" data-dark="{{DARK}}"></div>
    <div class="device side r" data-src="{{RIGHT}}" data-start="5100" data-dark="{{DARK}}"></div>
    <div class="device main" data-src="{{MAIN}}" data-start="5100,7600,9400,11200" data-classes=",s2,s3,s4" data-dark="{{DARK}}"></div>
  </div>

  <div class="end">
    <div>
      <img src="/local/docs/brand/lockup-on-dark.svg" alt="">
      <h2>Describe an app.<br>Get <em>every screen.</em></h2>
      <p>screenspell.app · link in bio</p>
    </div>
  </div>

  <script src="/local/scripts/video/films/device.js"></script>
  <script>
    // The prompt types itself on the film's clock (performance.now is the render's virtual time).
    const text = {{PROMPT}}
    const el = document.getElementById('typed')
    const start = 700, per = {{PER}}
    const tick = () => { el.textContent = text.slice(0, Math.max(0, Math.min(text.length, Math.floor((performance.now() - start) / per)))); requestAnimationFrame(tick) }
    requestAnimationFrame(tick)
  </script>
</body>
</html>
