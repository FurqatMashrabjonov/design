<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: IS; src: url(/local/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2) }
  @font-face { font-family: ISerif; font-style: italic; src: url(/local/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2) }
  :root { --ink: #1a1511; --lime: #c6f648; --paper: #f3f1ec; --muted: #a39d8f }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); font-family: IS; color: var(--paper) }
  .glow { position: absolute; inset: 0; background: radial-gradient(circle at 72% 45%, rgba(198,246,72,.16), transparent 55%); animation: breathe 6s ease-in-out both }
  .lockup { position: absolute; left: 140px; top: 120px; height: 44px; animation: fade .6s ease-out .1s both }
  .copy { position: absolute; left: 140px; top: 330px }
  .line { font-size: 120px; line-height: 1.02; font-weight: 600; letter-spacing: -.035em; white-space: nowrap }
  .w { display: inline-block; animation: rise .7s cubic-bezier(.2,.8,.2,1) both }
  em { font-family: ISerif; font-style: italic; font-weight: 400; letter-spacing: 0; position: relative; display: inline-block; animation: rise .8s cubic-bezier(.2,.8,.2,1) 1.0s both }
  em::after { content: ''; position: absolute; left: 0; right: 0; bottom: .02em; height: .1em; background: var(--lime); transform-origin: left; animation: draw .5s cubic-bezier(.6,0,.2,1) 1.7s both }
  .sub { margin-top: 34px; font-size: 30px; color: var(--muted); animation: fade .6s ease-out 2.1s both }
  .stage { position: absolute; right: 90px; top: 0; width: 900px; height: 1080px; animation: dolly 6s linear both }
  .phone { position: absolute; width: 390px; height: 844px; border-radius: 52px; border: 12px solid #2b2521; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.55); transform-origin: center; background: #fff }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block }
  .p1 { left: -30px; top: 150px; --r: -7deg; animation: phone .9s cubic-bezier(.2,.8,.2,1) 2.2s both }
  .p2 { left: 270px; top: 70px; --r: 0deg; z-index: 2; animation: phone .9s cubic-bezier(.2,.8,.2,1) 2.4s both }
  .p3 { left: 570px; top: 170px; --r: 7deg; animation: phone .9s cubic-bezier(.2,.8,.2,1) 2.6s both }
  @keyframes rise { from { opacity: 0; transform: translateY(60px) } to { opacity: 1; transform: none } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes draw { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @keyframes phone { from { opacity: 0; transform: translateY(220px) rotate(var(--r)) scale(.72) } to { opacity: 1; transform: rotate(var(--r)) scale(.72) } }
  @keyframes dolly { from { transform: scale(1.06) translateX(30px) } to { transform: scale(1) } }
  @keyframes breathe { 0% { opacity: .4 } 60% { opacity: 1 } 100% { opacity: .85 } }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="lockup" src="/local/docs/brand/lockup-on-dark.svg" alt="">
  <div class="copy">
    <div class="line"><span class="w" style="animation-delay:.25s">One</span> <span class="w" style="animation-delay:.4s">prompt.</span></div>
    <div class="line"><em>Eight screens.</em></div>
    <div class="sub">A habit tracker, designed in one go.</div>
  </div>
  <div class="stage">
    <div class="phone p1"><iframe data-start="2200" src="/api/thumb/bb54dc9c-c6ca-4e8a-9416-4b5226b3d155?t=UIxIZm-S9txIrgn8pf1Jhg"></iframe></div>
    <div class="phone p2"><iframe data-start="2400" src="/api/thumb/3d0e2a41-0267-49aa-b598-88c460450deb?t=UIxIZm-S9txIrgn8pf1Jhg"></iframe></div>
    <div class="phone p3"><iframe data-start="2600" src="/api/thumb/462918d4-44a5-490f-977c-53d221b040cd?t=UIxIZm-S9txIrgn8pf1Jhg"></iframe></div>
  </div>
</body>
</html>
