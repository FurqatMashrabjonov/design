<!-- Nutrition tracker: today tab -->
<div class="od-page">
  <header class="od-header">
    <div class="od-header__bar">
      <div class="od-header__actions">
        <button class="od-icon-btn" aria-label="Calendar"><i data-lucide="calendar"></i></button>
      </div>
    </div>
    <h1 class="od-header__title">Today</h1>
    <p class="od-header__sub">Wednesday, 3 September</p>
  </header>
  <div class="od-card">
    <div class="od-empty">
      <div class="od-ring od-ring--lg" style="--value:62%">
        <span class="od-ring__value">1,240</span>
        <span class="od-ring__label">of 2,000 kcal</span>
      </div>
      <p class="od-empty__text">760 kcal left for dinner and a snack</p>
      <button class="od-btn od-btn--sm">Log a meal</button>
    </div>
    <hr class="od-divider">
    <div class="od-metrics">
      <div class="od-stat"><span class="od-stat__label od-stat__label--micro">Protein</span><span class="od-stat__value">86 g</span><div class="od-progress od-progress--thin" style="--value:72%"><span></span></div></div>
      <div class="od-stat"><span class="od-stat__label od-stat__label--micro">Carbs</span><span class="od-stat__value">142 g</span><div class="od-progress od-progress--thin od-progress--warn" style="--value:57%"><span></span></div></div>
      <div class="od-stat"><span class="od-stat__label od-stat__label--micro">Fat</span><span class="od-stat__value">38 g</span><div class="od-progress od-progress--thin od-progress--success" style="--value:54%"><span></span></div></div>
    </div>
  </div>
  <section class="od-section">
    <span class="od-label">Meals</span>
    <div class="od-list">
      <a class="od-row od-row--media">
        <span class="od-row__lead"><img data-od-img="greek yogurt with berries and granola" alt="Yogurt bowl"></span>
        <span class="od-row__body"><span class="od-row__title">Yogurt, berries, granola</span><span class="od-row__sub">Breakfast, 8:10</span></span>
        <span class="od-row__trail od-row__trail--stack">410<span class="od-row__meta">kcal</span></span>
      </a>
      <a class="od-row od-row--media">
        <span class="od-row__lead"><img data-od-img="chicken quinoa salad bowl" alt="Chicken salad"></span>
        <span class="od-row__body"><span class="od-row__title">Chicken quinoa salad</span><span class="od-row__sub">Lunch, 13:05</span></span>
        <span class="od-row__trail od-row__trail--stack">620<span class="od-row__meta">kcal</span></span>
      </a>
      <a class="od-row od-row--media">
        <span class="od-row__lead"><img data-od-img="apple slices with peanut butter" alt="Apple and peanut butter"></span>
        <span class="od-row__body"><span class="od-row__title">Apple, peanut butter</span><span class="od-row__sub">Snack, 16:30</span></span>
        <span class="od-row__trail od-row__trail--stack">210<span class="od-row__meta">kcal</span></span>
      </a>
    </div>
  </section>
</div>
