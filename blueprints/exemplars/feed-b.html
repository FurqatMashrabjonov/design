<!-- Oshxona — a food delivery app's home: one wide featured tile, then a two-column grid of dishes -->
<div class="od-page">
  <header class="od-header od-header--greeting">
    <div class="od-header__bar">
      <span class="od-avatar"><img data-od-avatar="Jasur Aliev" alt="Jasur Aliev"></span>
      <div><p class="od-header__sub">Deliver to</p><h1 class="od-header__title">Chilanzar, block 9</h1></div>
      <div class="od-header__actions"><button class="od-icon-btn" aria-label="Cart"><i data-lucide="shopping-bag"></i></button></div>
    </div>
  </header>
  <div class="od-search"><i data-lucide="search"></i><input placeholder="Dishes, restaurants"></div>
  <div class="od-carousel"><button class="od-chip is-active">All</button><button class="od-chip">Plov</button><button class="od-chip">Burgers</button><button class="od-chip">Sushi</button><button class="od-chip">Salads</button><button class="od-chip">Desserts</button></div>
  <div class="od-bento">
    <a class="od-feature od-feature--wide od-bento__wide">
      <img data-od-img="plov in a large kazan" alt="Plov">
      <div class="od-feature__top"><span class="od-tag">−20% today</span></div>
      <div class="od-feature__body"><h2 class="od-feature__title">Friday plov at Besh Qozon</h2><p class="od-feature__meta">Free delivery until 14:00</p></div>
    </a>
    <a class="od-card od-card--media"><div class="od-media od-media--square"><img data-od-img="lamb shashlik skewers" alt="Shashlik"></div><div class="od-card__body"><p class="od-card__title">Lamb shashlik</p><p class="od-card__meta">Rayhon · 25 min</p></div></a>
    <a class="od-card od-card--media"><div class="od-media od-media--square"><img data-od-img="smash burger with fries" alt="Burger"></div><div class="od-card__body"><p class="od-card__title">Double smash</p><p class="od-card__meta">Bon Burger · 30 min</p></div></a>
    <a class="od-card od-card--media"><div class="od-media od-media--square"><img data-od-img="salmon poke bowl" alt="Poke bowl"></div><div class="od-card__body"><p class="od-card__title">Salmon poke</p><p class="od-card__meta">Kaizen · 35 min</p></div></a>
    <a class="od-card od-card--media"><div class="od-media od-media--square"><img data-od-img="honey cake slice" alt="Honey cake"></div><div class="od-card__body"><p class="od-card__title">Medovik</p><p class="od-card__meta">Safia · 20 min</p></div></a>
  </div>
</div>
