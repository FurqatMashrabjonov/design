<!-- Pinch — a recipe app's recipe detail: photo hero, content sheet over its edge -->
<div class="od-media"><img data-od-img="shakshuka in a cast iron pan, top view" alt="Shakshuka in a pan"></div>
<div class="od-sheet od-sheet--overlap">
  <div class="od-sheet__grabber"></div>
  <div>
    <h1 class="od-hero__title">Shakshuka with feta</h1>
    <p class="od-hero__sub">Malika Yusupova · <span class="od-rating"><i data-lucide="star"></i>4.8</span> (312)</p>
  </div>
  <div class="od-metrics">
    <div class="od-stat"><span class="od-stat__label">Time</span><span class="od-stat__value">25</span><span class="od-stat__delta">min</span></div>
    <div class="od-stat"><span class="od-stat__label">Serves</span><span class="od-stat__value">2</span><span class="od-stat__delta">people</span></div>
    <div class="od-stat"><span class="od-stat__label">Energy</span><span class="od-stat__value">410</span><span class="od-stat__delta">kcal</span></div>
  </div>
  <hr class="od-divider">
  <p class="od-hero__sub">Eggs poached in a smoky tomato and pepper sauce, finished with crumbled feta and parsley. One pan, and bread for the sauce.</p>
  <section class="od-section">
    <div class="od-section__head"><h2 class="od-section__title">Ingredients</h2><button class="od-section__link">Add to list</button></div>
    <div class="od-list">
      <label class="od-row od-row--compact"><input type="checkbox" class="od-check" checked><span class="od-row__body"><span class="od-row__title">Eggs</span></span><span class="od-row__value">4</span></label>
      <label class="od-row od-row--compact"><input type="checkbox" class="od-check" checked><span class="od-row__body"><span class="od-row__title">Chopped tomatoes</span></span><span class="od-row__value">400 g</span></label>
      <label class="od-row od-row--compact"><input type="checkbox" class="od-check"><span class="od-row__body"><span class="od-row__title">Red pepper</span></span><span class="od-row__value">1</span></label>
      <label class="od-row od-row--compact"><input type="checkbox" class="od-check"><span class="od-row__body"><span class="od-row__title">Smoked paprika</span></span><span class="od-row__value">1 tsp</span></label>
      <label class="od-row od-row--compact"><input type="checkbox" class="od-check"><span class="od-row__body"><span class="od-row__title">Feta</span></span><span class="od-row__value">80 g</span></label>
    </div>
  </section>
</div>
<div class="od-bottom-bar">
  <button class="od-icon-btn" aria-label="Save recipe"><i data-lucide="bookmark"></i></button>
  <button class="od-btn">Start cooking</button>
</div>
