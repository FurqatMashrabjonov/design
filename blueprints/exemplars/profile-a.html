<!-- Travel photography community: profile tab -->
<div class="od-page">
  <div class="od-empty">
    <span class="od-avatar od-avatar--lg"><img data-od-avatar="Leyla Nazarova" alt="Leyla Nazarova"></span>
    <h1 class="od-hero__title">Leyla Nazarova</h1>
    <p class="od-empty__text">@leyla.frames · Samarkand</p>
    <button class="od-btn od-btn--secondary od-btn--sm">Edit profile</button>
  </div>
  <div class="od-card">
    <div class="od-metrics">
      <div class="od-stat"><span class="od-stat__value">248</span><span class="od-stat__label">Photos</span></div>
      <div class="od-stat"><span class="od-stat__value">12.4k</span><span class="od-stat__label">Followers</span></div>
      <div class="od-stat"><span class="od-stat__value">31</span><span class="od-stat__label">Countries</span></div>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Your work</span>
    <div class="od-list">
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="bookmark"></i></span><span class="od-row__body"><span class="od-row__title">Saved spots</span></span><span class="od-row__trail"><span class="od-row__value">64</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="map"></i></span><span class="od-row__body"><span class="od-row__title">Trip journals</span></span><span class="od-row__trail"><span class="od-row__value">9</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="image-plus"></i></span><span class="od-row__body"><span class="od-row__title">Drafts</span></span><span class="od-row__trail"><span class="od-row__value">3</span></span></a>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Account</span>
    <div class="od-list">
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="bell"></i></span><span class="od-row__body"><span class="od-row__title">Notifications</span></span><span class="od-row__trail"></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="lock"></i></span><span class="od-row__body"><span class="od-row__title">Privacy</span></span><span class="od-row__trail"><span class="od-row__value">Followers only</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="life-buoy"></i></span><span class="od-row__body"><span class="od-row__title">Help and feedback</span></span><span class="od-row__trail"></span></a>
    </div>
  </div>
  <button class="od-btn od-btn--ghost">Sign out</button>
</div>
