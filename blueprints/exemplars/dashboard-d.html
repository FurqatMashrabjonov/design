<!-- Sleep and recovery app: home tab -->
<div class="od-page">
  <header class="od-header">
    <div class="od-header__bar">
      <div class="od-header__actions">
        <button class="od-icon-btn" aria-label="Settings"><i data-lucide="sliders-horizontal"></i></button>
      </div>
    </div>
    <h1 class="od-header__title">Good morning, Timur</h1>
    <p class="od-header__sub">Saturday, 21 June</p>
  </header>
  <div class="od-bento">
    <div class="od-summary od-bento__wide">
      <span class="od-label">Last night</span>
      <p class="od-summary__value">86</p>
      <p class="od-summary__meta">Sleep score, 9 points above your average</p>
      <div data-od-chart="sparkline" data-values="75,78,74,79,80,76,86"></div>
    </div>
    <div class="od-card">
      <div class="od-stat od-stat--sm">
        <span class="od-stat__icon"><i data-lucide="moon"></i></span>
        <span class="od-stat__label od-stat__label--micro">Asleep</span>
        <span class="od-stat__value">7h 42m</span>
        <span class="od-stat__delta">23:14 – 7:02</span>
      </div>
    </div>
    <div class="od-card">
      <div class="od-stat od-stat--sm">
        <span class="od-stat__icon"><i data-lucide="heart-pulse"></i></span>
        <span class="od-stat__label od-stat__label--micro">Resting HR</span>
        <span class="od-stat__value">54 bpm</span>
        <span class="od-stat__delta od-stat__delta--up">−3 this week</span>
      </div>
    </div>
    <a class="od-feature">
      <img data-od-img="rainy street in kyoto at night" alt="Rainy street at night">
      <div class="od-feature__body">
        <span class="od-feature__eyebrow">Sleep story</span>
        <h3 class="od-feature__title">Rain over Kyoto</h3>
        <p class="od-feature__meta">24 min</p>
      </div>
    </a>
    <div class="od-summary od-summary--tinted">
      <span class="od-label od-label--accent">Tonight</span>
      <p class="od-card__title">Wind down at 22:30</p>
      <p class="od-summary__meta">Breathing, then lights out by 23:00</p>
      <div class="od-summary__foot">
        <button class="od-btn od-btn--sm od-btn--block">Set reminder</button>
      </div>
    </div>
  </div>
  <section class="od-section">
    <span class="od-label">Today's habits</span>
    <div class="od-list">
      <label class="od-row"><input type="checkbox" class="od-check" checked><span class="od-row__body"><span class="od-row__title">Morning light, 10 min</span><span class="od-row__sub">Done at 7:40</span></span></label>
      <label class="od-row"><input type="checkbox" class="od-check"><span class="od-row__body"><span class="od-row__title">Last coffee before 14:00</span><span class="od-row__sub">Keeps deep sleep longer</span></span></label>
      <label class="od-row"><input type="checkbox" class="od-check"><span class="od-row__body"><span class="od-row__title">No screens after 22:00</span><span class="od-row__sub">5 nights in a row</span></span></label>
    </div>
  </section>
</div>
