<!-- Climbing gym membership app: profile tab -->
<div class="od-page">
  <div class="od-bento">
    <div class="od-card od-bento__wide">
      <div class="od-header od-header--greeting">
        <div class="od-header__bar">
          <span class="od-avatar od-avatar--lg"><img data-od-avatar="Jasur Karimov" alt="Jasur Karimov"></span>
          <div>
            <h1 class="od-header__title">Jasur Karimov</h1>
            <p class="od-header__sub">Member since March 2023</p>
          </div>
        </div>
      </div>
      <div class="od-summary__foot">
        <span class="od-tag">Unlimited pass</span>
        <button class="od-btn od-btn--secondary od-btn--sm">Show check-in code</button>
      </div>
    </div>
    <div class="od-card">
      <div class="od-stat">
        <span class="od-stat__label od-stat__label--micro">Sessions</span>
        <span class="od-stat__value">64</span>
        <span class="od-stat__delta">this year</span>
      </div>
    </div>
    <div class="od-card">
      <div class="od-stat">
        <span class="od-stat__label od-stat__label--micro">Hardest send</span>
        <span class="od-stat__value">V6</span>
        <span class="od-stat__delta od-stat__delta--up">New in May</span>
      </div>
    </div>
    <div class="od-card">
      <div class="od-stat">
        <span class="od-stat__label od-stat__label--micro">On the wall</span>
        <span class="od-stat__value">92 h</span>
        <span class="od-stat__delta">this year</span>
      </div>
    </div>
    <div class="od-card">
      <div class="od-stat">
        <span class="od-stat__label od-stat__label--micro">Week streak</span>
        <span class="od-stat__value">5</span>
        <span class="od-stat__delta">Best is 9</span>
      </div>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Membership</span>
    <div class="od-list">
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="credit-card"></i></span><span class="od-row__body"><span class="od-row__title">Plan and billing</span></span><span class="od-row__trail"><span class="od-row__value">Renews 1 Aug</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="ticket"></i></span><span class="od-row__body"><span class="od-row__title">Guest passes</span></span><span class="od-row__trail"><span class="od-row__value">2 left</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="calendar-check"></i></span><span class="od-row__body"><span class="od-row__title">Booked classes</span></span><span class="od-row__trail"><span class="od-row__value">1</span></span></a>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">App</span>
    <div class="od-list">
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="bell"></i></span><span class="od-row__body"><span class="od-row__title">Notifications</span></span><span class="od-row__trail"></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="ruler"></i></span><span class="od-row__body"><span class="od-row__title">Grading scale</span></span><span class="od-row__trail"><span class="od-row__value">V-scale</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="circle-help"></i></span><span class="od-row__body"><span class="od-row__title">Help</span></span><span class="od-row__trail"></span></a>
    </div>
  </div>
</div>
