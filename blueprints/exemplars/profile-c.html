<!-- Reading and book club app: profile tab -->
<div class="od-page">
  <div class="od-summary od-summary--image">
    <img data-od-img="warm library reading room with wooden shelves" alt="">
    <span class="od-avatar od-avatar--lg"><img data-od-avatar="Madina Yusupova" alt="Madina Yusupova"></span>
    <p class="od-feature__title">Madina Yusupova</p>
    <p class="od-summary__meta">@madinareads · Mostly essays and Russian classics</p>
  </div>
  <div class="od-card">
    <div class="od-metrics">
      <div class="od-stat"><span class="od-stat__label">Read in 2025</span><span class="od-stat__value">27</span></div>
      <div class="od-stat"><span class="od-stat__label">Pages</span><span class="od-stat__value">8,940</span></div>
      <div class="od-stat"><span class="od-stat__label">Reviews</span><span class="od-stat__value">19</span></div>
    </div>
  </div>
  <section class="od-section">
    <div class="od-section__head">
      <span class="od-label">Shelves</span>
      <button class="od-section__link">Edit</button>
    </div>
    <div class="od-grid">
      <a class="od-card od-card--media">
        <div class="od-media"><img data-od-img="open book on a table with coffee" alt=""></div>
        <div class="od-card__body"><p class="od-card__title">Reading now</p><p class="od-card__meta">2 books</p></div>
      </a>
      <a class="od-card od-card--media">
        <div class="od-media"><img data-od-img="stack of new hardcover books" alt=""></div>
        <div class="od-card__body"><p class="od-card__title">Want to read</p><p class="od-card__meta">41 books</p></div>
      </a>
      <a class="od-card od-card--media">
        <div class="od-media"><img data-od-img="old worn classic novels on a shelf" alt=""></div>
        <div class="od-card__body"><p class="od-card__title">Favourites</p><p class="od-card__meta">16 books</p></div>
      </a>
      <a class="od-card od-card--media">
        <div class="od-media"><img data-od-img="book club friends talking in a cafe" alt=""></div>
        <div class="od-card__body"><p class="od-card__title">Club picks</p><p class="od-card__meta">Next meet 4 July</p></div>
      </a>
    </div>
  </section>
  <div class="od-list">
    <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="target"></i></span><span class="od-row__body"><span class="od-row__title">Reading goal</span></span><span class="od-row__trail"><span class="od-row__value">27 of 40</span></span></a>
    <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="settings"></i></span><span class="od-row__body"><span class="od-row__title">Settings</span></span><span class="od-row__trail"></span></a>
  </div>
</div>
