<!-- Hearth — a smart-home app's Devices tab: inset groups, one per room -->
<div class="od-page">
  <header class="od-header">
    <div class="od-header__bar"><div class="od-header__actions"><button class="od-icon-btn" aria-label="Add device"><i data-lucide="plus"></i></button></div></div>
    <h1 class="od-header__title">Devices</h1>
    <p class="od-header__sub">14 devices · 5 on</p>
  </header>
  <div class="od-segmented"><button class="is-active">All</button><button>Lights</button><button>Climate</button><button>Security</button></div>
  <div class="od-group">
    <span class="od-label od-group__label">Living room</span>
    <div class="od-list">
      <div class="od-row"><span class="od-row__lead"><i data-lucide="lamp-floor"></i></span><span class="od-row__body"><span class="od-row__title">Floor lamp</span><span class="od-row__sub">Warm white · 60%</span></span><input type="checkbox" class="od-switch" role="switch" checked aria-label="Floor lamp"></div>
      <a class="od-row od-row--chevron"><span class="od-row__lead"><i data-lucide="thermometer"></i></span><span class="od-row__body"><span class="od-row__title">Thermostat</span><span class="od-row__sub">Heating to 22°</span></span><span class="od-row__trail">20.5°</span></a>
      <a class="od-row od-row--chevron"><span class="od-row__lead"><i data-lucide="tv"></i></span><span class="od-row__body"><span class="od-row__title">Samsung Frame</span><span class="od-row__sub">Standby</span></span><span class="od-row__trail"><span class="od-row__value">Off</span></span></a>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Bedroom</span>
    <div class="od-list">
      <div class="od-row"><span class="od-row__lead"><i data-lucide="lightbulb"></i></span><span class="od-row__body"><span class="od-row__title">Ceiling light</span><span class="od-row__sub">Off since 07:40</span></span><input type="checkbox" class="od-switch" role="switch" aria-label="Ceiling light"></div>
      <a class="od-row od-row--chevron"><span class="od-row__lead"><i data-lucide="wind"></i></span><span class="od-row__body"><span class="od-row__title">Air purifier</span><span class="od-row__sub">Auto · PM2.5 good</span></span><span class="od-row__trail">12 µg</span></a>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Entrance</span>
    <div class="od-list">
      <a class="od-row od-row--chevron"><span class="od-row__lead"><i data-lucide="lock"></i></span><span class="od-row__body"><span class="od-row__title">Front door</span><span class="od-row__sub">Locked by Madina</span></span><span class="od-row__trail"><span class="od-row__value">22:10</span></span></a>
    </div>
    <p class="od-group__note">The door locks itself 2 minutes after it closes.</p>
  </div>
</div>
