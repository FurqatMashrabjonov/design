<!-- Qozon — a recipe app. Sheet, layout b: share sheet over the recipe it shares. -->
<div class="od-media od-media--wide"><img data-od-img="plov in a large kazan, top view" alt="Plov"></div>
<div class="od-page">
  <header class="od-header"><h1 class="od-header__title">Tashkent plov</h1><p class="od-header__sub">1 h 40 min · 6 servings</p></header>
</div>
<div class="od-scrim"></div>
<div class="od-sheet od-sheet--overlay">
  <div class="od-sheet__grabber"></div>
  <div class="od-sheet__head"><span></span><h2 class="od-sheet__title">Share recipe</h2><button class="od-icon-btn" aria-label="Close"><i data-lucide="x"></i></button></div>
  <div class="od-row od-row--media"><span class="od-row__lead"><img data-od-img="plov in a large kazan, top view" alt=""></span><span class="od-row__body"><span class="od-row__title">Tashkent plov</span><span class="od-row__sub">by Aziza Karimova · 4.9</span></span></div>
  <div class="od-options od-options--4">
    <button class="od-option"><i data-lucide="link"></i>Copy</button>
    <button class="od-option"><i data-lucide="message-circle"></i>Message</button>
    <button class="od-option"><i data-lucide="mail"></i>Mail</button>
    <button class="od-option"><i data-lucide="more-horizontal"></i>More</button>
  </div>
  <div class="od-list">
    <a class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="calendar-plus"></i></span><span class="od-row__body"><span class="od-row__title">Add to this week's plan</span></span></a>
    <a class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="download"></i></span><span class="od-row__body"><span class="od-row__title">Save for offline</span></span></a>
    <a class="od-row od-row--compact od-row--danger"><span class="od-row__lead"><i data-lucide="flag"></i></span><span class="od-row__body"><span class="od-row__title">Report recipe</span></span></a>
  </div>
</div>
