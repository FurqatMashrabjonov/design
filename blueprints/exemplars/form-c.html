<!-- Nestly — a home-rental host app. Form, layout c: stepped, step 2 of 3, only this step's fields, Continue at the bottom. -->
<div class="od-page">
  <div class="od-stack">
    <div class="od-section__head"><span class="od-label">Step 2 of 3</span><span class="od-label">Basics</span></div>
    <div class="od-progress od-progress--thin" style="--value:66%"><span></span></div>
  </div>
  <div>
    <h1 class="od-hero__title">What kind of place is it?</h1>
    <p class="od-hero__sub">Guests filter by this first.</p>
  </div>
  <div class="od-options od-options--2">
    <button class="od-option is-active"><i data-lucide="building-2"></i>Apartment</button>
    <button class="od-option"><i data-lucide="house"></i>House</button>
    <button class="od-option"><i data-lucide="tent-tree"></i>Cabin</button>
    <button class="od-option"><i data-lucide="door-open"></i>Private room</button>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">How many</span>
    <div class="od-list">
      <div class="od-row"><span class="od-row__body"><span class="od-row__title">Guests</span></span><span class="od-stepper"><button aria-label="Fewer guests">−</button><output>4</output><button aria-label="More guests">+</button></span></div>
      <div class="od-row"><span class="od-row__body"><span class="od-row__title">Bedrooms</span></span><span class="od-stepper"><button aria-label="Fewer bedrooms">−</button><output>2</output><button aria-label="More bedrooms">+</button></span></div>
      <div class="od-row"><span class="od-row__body"><span class="od-row__title">Bathrooms</span></span><span class="od-stepper"><button aria-label="Fewer bathrooms">−</button><output>1</output><button aria-label="More bathrooms">+</button></span></div>
    </div>
    <p class="od-group__note">You can change these any time from the listing.</p>
  </div>
</div>
<div class="od-bottom-bar"><button class="od-btn od-btn--secondary">Back</button><button class="od-btn">Continue</button></div>
