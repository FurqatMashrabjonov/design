<!-- Hush — a meditation app. Settings, layout b: a plain list, solid icon tiles, space and small headers between sections. -->
<div class="od-page">
  <header class="od-header"><h1 class="od-header__title">Settings</h1><p class="od-header__sub">malika.r@icloud.com</p></header>
  <div class="od-group">
    <span class="od-label od-group__label">Practice</span>
    <div class="od-list od-list--plain">
      <label class="od-row od-row--compact"><span class="od-row__lead od-row__lead--solid"><i data-lucide="alarm-clock"></i></span><span class="od-row__body"><span class="od-row__title">Daily reminder</span><span class="od-row__sub">7:30 on weekdays</span></span><input type="checkbox" class="od-switch" role="switch" checked></label>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead od-row__lead--solid"><i data-lucide="timer"></i></span><span class="od-row__body"><span class="od-row__title">Session length</span></span><span class="od-row__trail"><span class="od-row__value">12 min</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead od-row__lead--solid"><i data-lucide="cloud-rain"></i></span><span class="od-row__body"><span class="od-row__title">Background sound</span></span><span class="od-row__trail"><span class="od-row__value">Soft rain</span></span></a>
      <label class="od-row od-row--compact"><span class="od-row__lead od-row__lead--solid"><i data-lucide="bell-ring"></i></span><span class="od-row__body"><span class="od-row__title">Closing bell</span></span><input type="checkbox" class="od-switch" role="switch" checked></label>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Health</span>
    <div class="od-list od-list--plain">
      <label class="od-row od-row--compact"><span class="od-row__lead od-row__lead--solid"><i data-lucide="heart-pulse"></i></span><span class="od-row__body"><span class="od-row__title">Save mindful minutes</span></span><input type="checkbox" class="od-switch" role="switch"></label>
    </div>
    <p class="od-group__note">Written to Health after each session.</p>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Membership</span>
    <div class="od-list od-list--plain">
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead od-row__lead--solid"><i data-lucide="crown"></i></span><span class="od-row__body"><span class="od-row__title">Plan</span></span><span class="od-row__trail"><span class="od-row__value">Yearly</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead od-row__lead--solid"><i data-lucide="life-buoy"></i></span><span class="od-row__body"><span class="od-row__title">Help and feedback</span></span><span class="od-row__trail"></span></a>
    </div>
  </div>
  <p class="od-group__note">Hush 2.8.0</p>
</div>
