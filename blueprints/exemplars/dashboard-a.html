<!-- Personal finance app: home tab -->
<div class="od-page">
  <header class="od-header od-header--greeting">
    <div class="od-header__bar">
      <span class="od-avatar"><img data-od-avatar="Dilnoza Rakhimova" alt="Dilnoza Rakhimova"></span>
      <div>
        <p class="od-header__sub">Thursday, 12 June</p>
        <h1 class="od-header__title">Hi, Dilnoza</h1>
      </div>
      <div class="od-header__actions">
        <button class="od-icon-btn" aria-label="Notifications"><i data-lucide="bell"></i></button>
      </div>
    </div>
  </header>
  <div class="od-summary">
    <p class="od-summary__label">Safe to spend until payday</p>
    <p class="od-summary__value">$1,284</p>
    <p class="od-summary__meta">$92 a day for the next 14 days</p>
    <div class="od-progress od-progress--thin" style="--value:58%"><span></span></div>
    <div class="od-summary__foot">
      <span class="od-tag od-tag--success">$140 under plan</span>
      <button class="od-btn od-btn--sm">Move to savings</button>
    </div>
  </div>
  <div class="od-grid">
    <div class="od-card">
      <div class="od-stat od-stat--sm">
        <span class="od-stat__icon"><i data-lucide="piggy-bank"></i></span>
        <span class="od-stat__label od-stat__label--micro">Savings</span>
        <span class="od-stat__value">$8,420</span>
        <span class="od-stat__delta od-stat__delta--up">+$310 this month</span>
      </div>
    </div>
    <div class="od-card">
      <div class="od-stat od-stat--sm">
        <span class="od-stat__icon"><i data-lucide="credit-card"></i></span>
        <span class="od-stat__label od-stat__label--micro">Card bill</span>
        <span class="od-stat__value">$612</span>
        <span class="od-stat__delta">Due 20 June</span>
      </div>
    </div>
  </div>
  <section class="od-section">
    <div class="od-section__head">
      <span class="od-label">Coming up</span>
      <button class="od-section__link">See all</button>
    </div>
    <div class="od-list">
      <a class="od-row od-row--chevron">
        <span class="od-row__lead"><i data-lucide="home"></i></span>
        <span class="od-row__body"><span class="od-row__title">Rent</span><span class="od-row__sub">Tomorrow · Autopay</span></span>
        <span class="od-row__trail">$950</span>
      </a>
      <a class="od-row od-row--chevron">
        <span class="od-row__lead"><i data-lucide="wifi"></i></span>
        <span class="od-row__body"><span class="od-row__title">Home internet</span><span class="od-row__sub">Sat, 14 June</span></span>
        <span class="od-row__trail">$38</span>
      </a>
      <a class="od-row od-row--chevron">
        <span class="od-row__lead"><i data-lucide="dumbbell"></i></span>
        <span class="od-row__body"><span class="od-row__title">Gym membership</span><span class="od-row__sub">Mon, 16 June</span></span>
        <span class="od-row__trail">$29</span>
      </a>
    </div>
  </section>
</div>
