<!-- Hamroh — a hiking club's direct messages: classic bubbles, a photo, a reaction, typing, the composer pinned -->
<div class="od-page" style="padding-bottom:0">
  <div class="od-header od-header--greeting"><div class="od-header__bar"><span class="od-avatar"><img data-od-avatar="Dilnoza Aliyeva" alt=""></span><div><h2 class="od-header__title">Dilnoza Aliyeva</h2><p class="od-header__sub">Online · Chimgan trip</p></div><div class="od-header__actions"><button class="od-icon-btn" aria-label="Call"><i data-lucide="phone"></i></button></div></div></div>
</div>
<div class="od-chat">
  <span class="od-chat__day">Yesterday</span>
  <div class="od-bubble">Did you book the minivan for Saturday?<span class="od-bubble__time">21:40</span></div>
  <div class="od-bubble od-bubble--out">Yes, 8 seats. Pickup at 6:30 by the metro<span class="od-bubble__time">21:52</span></div>
  <span class="od-chat__day">Today</span>
  <div class="od-bubble">Forecast looks clear all day<span class="od-bubble__time">08:05</span></div>
  <div class="od-bubble od-bubble--media"><img data-od-img="mountain trail above a lake" alt="The trail"></div>
  <div class="od-bubble">This is the ridge we talked about<span class="od-bubble__time">08:06</span></div>
  <div class="od-bubble od-bubble--out">Wow. Bringing the big camera<span class="od-bubble__time">08:11</span><span class="od-bubble__reactions"><i data-lucide="heart"></i>1</span></div>
  <div class="od-bubble od-bubble--out">Should I pack lunch for everyone?<span class="od-bubble__time">08:12</span></div>
  <div class="od-bubble"><span class="od-typing" aria-label="Dilnoza is typing"><i></i><i></i><i></i></span></div>
</div>
<div class="od-bottom-bar">
  <button class="od-icon-btn" aria-label="Attach"><i data-lucide="plus"></i></button>
  <label class="od-composer"><input placeholder="Message"><button class="od-composer__send" aria-label="Send"><i data-lucide="arrow-up"></i></button></label>
</div>
