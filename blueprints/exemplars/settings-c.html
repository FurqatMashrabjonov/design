<!-- Keepsake — a photo backup app. Settings, layout c: the account card first, grouped rows below. -->
<div class="od-page">
  <header class="od-header"><h1 class="od-header__title">Account</h1></header>
  <div class="od-summary">
    <div class="od-header od-header--greeting"><div class="od-header__bar"><span class="od-avatar od-avatar--lg"><img data-od-avatar="Nodira Yusupova" alt="Nodira Yusupova"></span><div><h2 class="od-header__title">Nodira Yusupova</h2><p class="od-header__sub">nodira.y@gmail.com</p></div></div></div>
    <div class="od-summary__foot"><span class="od-label">Storage</span><span class="od-tag">Plus plan</span></div>
    <div class="od-progress" style="--value:71%"><span></span></div>
    <p class="od-summary__meta">142 of 200 GB used by 18,406 photos</p>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Backup</span>
    <div class="od-list">
      <label class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="signal"></i></span><span class="od-row__body"><span class="od-row__title">Use mobile data</span></span><input type="checkbox" class="od-switch" role="switch"></label>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="image"></i></span><span class="od-row__body"><span class="od-row__title">Upload quality</span></span><span class="od-row__trail"><span class="od-row__value">Original</span></span></a>
      <label class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="clapperboard"></i></span><span class="od-row__body"><span class="od-row__title">Include videos</span></span><input type="checkbox" class="od-switch" role="switch" checked></label>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Sharing</span>
    <div class="od-list">
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="users"></i></span><span class="od-row__body"><span class="od-row__title">Partner library</span></span><span class="od-row__trail"><span class="od-row__value">Timur</span></span></a>
      <label class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="map-pin-off"></i></span><span class="od-row__body"><span class="od-row__title">Hide location in shares</span></span><input type="checkbox" class="od-switch" role="switch" checked></label>
    </div>
  </div>
  <div class="od-list">
    <a class="od-row od-row--compact od-row--danger"><span class="od-row__lead"><i data-lucide="log-out"></i></span><span class="od-row__body"><span class="od-row__title">Sign out</span></span></a>
  </div>
  <p class="od-group__note">Keepsake 5.2. Last backup 4 minutes ago.</p>
</div>
