<!-- Kuy — a music streaming app's Search tab: field, recent chips, genres as large photo tiles -->
<div class="od-page">
  <div class="od-search"><i data-lucide="search"></i><input placeholder="Artists, songs, podcasts" autofocus><button class="od-icon-btn" aria-label="Clear"><i data-lucide="x"></i></button></div>
  <section class="od-section">
    <div class="od-section__head"><span class="od-label">Recent</span><button class="od-section__link">Clear</button></div>
    <div class="od-carousel"><button class="od-chip od-chip--sm">Shahzoda</button><button class="od-chip od-chip--sm">lo-fi for study</button><button class="od-chip od-chip--sm">Yulduz Usmonova</button><button class="od-chip od-chip--sm">Dua Lipa</button></div>
  </section>
  <section class="od-section">
    <span class="od-label">Browse all</span>
    <div class="od-grid">
      <a class="od-feature"><img data-od-img="singer on stage in pink light" alt=""><div class="od-feature__body"><h3 class="od-feature__title">Pop</h3><p class="od-feature__meta">1,240 playlists</p></div></a>
      <a class="od-feature"><img data-od-img="doira frame drum close up" alt=""><div class="od-feature__body"><h3 class="od-feature__title">Uzbek estrada</h3><p class="od-feature__meta">380 playlists</p></div></a>
      <a class="od-feature"><img data-od-img="rapper in a hoodie at night" alt=""><div class="od-feature__body"><h3 class="od-feature__title">Hip-hop</h3><p class="od-feature__meta">910 playlists</p></div></a>
      <a class="od-feature"><img data-od-img="vinyl record player in a warm room" alt=""><div class="od-feature__body"><h3 class="od-feature__title">Chill</h3><p class="od-feature__meta">655 playlists</p></div></a>
      <a class="od-feature"><img data-od-img="people running at sunrise" alt=""><div class="od-feature__body"><h3 class="od-feature__title">Workout</h3><p class="od-feature__meta">420 playlists</p></div></a>
      <a class="od-feature"><img data-od-img="cello player in a concert hall" alt=""><div class="od-feature__body"><h3 class="od-feature__title">Classical</h3><p class="od-feature__meta">300 playlists</p></div></a>
    </div>
  </section>
</div>
