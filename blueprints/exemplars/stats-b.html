<!-- Music streaming app: listening stats -->
<div class="od-page">
  <header class="od-header">
    <h1 class="od-header__title">Your listening</h1>
    <p class="od-header__sub">1 – 30 November</p>
  </header>
  <div class="od-segmented od-segmented--pill">
    <button>Week</button>
    <button class="is-active">Month</button>
    <button>Year</button>
  </div>
  <div class="od-summary od-summary--tinted">
    <p class="od-summary__label">Time listened</p>
    <p class="od-summary__value">38h 20m</p>
    <p class="od-summary__meta">About 1h 17m a day, up 4h 05m on October</p>
  </div>
  <div class="od-grid">
    <div class="od-card">
      <span class="od-stat__label od-stat__label--micro">Tracks</span>
      <span class="od-stat__value">612</span>
      <div data-od-chart="sparkline" data-values="18,22,19,25,21,27,24"></div>
    </div>
    <div class="od-card">
      <span class="od-stat__label od-stat__label--micro">Artists</span>
      <span class="od-stat__value">147</span>
      <div data-od-chart="sparkline" data-values="9,11,10,12,14,13,15"></div>
    </div>
    <div class="od-card">
      <span class="od-stat__label od-stat__label--micro">New finds</span>
      <span class="od-stat__value">39</span>
      <div data-od-chart="sparkline" data-values="3,2,5,4,6,5,7"></div>
    </div>
    <div class="od-card">
      <span class="od-stat__label od-stat__label--micro">Late nights</span>
      <span class="od-stat__value">11</span>
      <div data-od-chart="sparkline" data-values="2,1,3,1,2,1,1"></div>
    </div>
  </div>
  <section class="od-section">
    <div class="od-section__head">
      <span class="od-label">Top genres</span>
      <button class="od-section__link">All genres</button>
    </div>
    <div class="od-list">
      <div class="od-row">
        <span class="od-row__lead od-row__lead--round"><img data-od-img="indie band on a small stage" alt=""></span>
        <span class="od-row__body"><span class="od-row__title">Indie</span><span class="od-row__sub">37% of your time</span></span>
        <span class="od-row__trail">14h 10m</span>
      </div>
      <div class="od-row">
        <span class="od-row__lead od-row__lead--round"><img data-od-img="saxophone player in a jazz club" alt=""></span>
        <span class="od-row__body"><span class="od-row__title">Jazz</span><span class="od-row__sub">25% of your time</span></span>
        <span class="od-row__trail">9h 45m</span>
      </div>
      <div class="od-row">
        <span class="od-row__lead od-row__lead--round"><img data-od-img="rapper with microphone in studio" alt=""></span>
        <span class="od-row__body"><span class="od-row__title">Hip-hop</span><span class="od-row__sub">21% of your time</span></span>
        <span class="od-row__trail">8h 05m</span>
      </div>
      <div class="od-row">
        <span class="od-row__lead od-row__lead--round"><img data-od-img="grand piano on a concert stage" alt=""></span>
        <span class="od-row__body"><span class="od-row__title">Classical</span><span class="od-row__sub">17% of your time</span></span>
        <span class="od-row__trail">6h 20m</span>
      </div>
    </div>
  </section>
</div>
