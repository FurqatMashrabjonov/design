<!-- Tally — a personal budget app. Settings, layout a: grouped inset lists, trailing controls. -->
<div class="od-page">
  <header class="od-header"><h1 class="od-header__title">Settings</h1></header>
  <div class="od-group">
    <span class="od-label od-group__label">General</span>
    <div class="od-list">
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="coins"></i></span><span class="od-row__body"><span class="od-row__title">Currency</span></span><span class="od-row__trail"><span class="od-row__value">UZS</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="calendar-days"></i></span><span class="od-row__body"><span class="od-row__title">Budget starts on</span></span><span class="od-row__trail"><span class="od-row__value">25th</span></span></a>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="sun-moon"></i></span><span class="od-row__body"><span class="od-row__title">Appearance</span></span><span class="od-row__trail"><span class="od-row__value">System</span></span></a>
    </div>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Alerts</span>
    <div class="od-list">
      <label class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="receipt"></i></span><span class="od-row__body"><span class="od-row__title">Bills due soon</span></span><input type="checkbox" class="od-switch" role="switch" checked></label>
      <label class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="gauge"></i></span><span class="od-row__body"><span class="od-row__title">Category over 80%</span></span><input type="checkbox" class="od-switch" role="switch" checked></label>
      <label class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="mail"></i></span><span class="od-row__body"><span class="od-row__title">Sunday summary</span></span><input type="checkbox" class="od-switch" role="switch"></label>
    </div>
    <p class="od-group__note">Alerts arrive at 9:00, never at night.</p>
  </div>
  <div class="od-group">
    <span class="od-label od-group__label">Security</span>
    <div class="od-list">
      <label class="od-row od-row--compact"><span class="od-row__lead"><i data-lucide="scan-face"></i></span><span class="od-row__body"><span class="od-row__title">Unlock with Face ID</span></span><input type="checkbox" class="od-switch" role="switch" checked></label>
      <a class="od-row od-row--compact od-row--chevron"><span class="od-row__lead"><i data-lucide="file-down"></i></span><span class="od-row__body"><span class="od-row__title">Export transactions</span></span><span class="od-row__trail"><span class="od-row__value">CSV</span></span></a>
    </div>
  </div>
  <div class="od-list">
    <a class="od-row od-row--compact od-row--danger"><span class="od-row__body"><span class="od-row__title">Delete account</span></span></a>
  </div>
  <p class="od-group__note">Tally 3.4.1 (812)</p>
</div>
