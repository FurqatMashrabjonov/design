<!-- Drift — a sleep tracker. Onboarding, layout a: a large illustration on top, headline, one sentence, page dots, Continue. -->
<div class="od-page od-page--fill">
  <div class="od-header__bar"><div class="od-header__actions"><button class="od-btn od-btn--ghost od-btn--sm">Skip</button></div></div>
  <div class="od-art">
    <div class="od-ring od-ring--lg" style="--value:86%"><span class="od-ring__value">7h 42m</span><span class="od-ring__label">asleep last night</span></div>
    <div class="od-chips"><span class="od-chip od-chip--sm"><i data-lucide="moon"></i>Deep 1h 50m</span><span class="od-chip od-chip--sm"><i data-lucide="sparkles"></i>REM 1h 36m</span></div>
  </div>
  <div>
    <h1 class="od-hero__title">Wake up knowing how you slept</h1>
    <p class="od-hero__sub">Leave your phone on the nightstand and Drift has the night charted by morning.</p>
  </div>
  <div class="od-stack">
    <div class="od-dots"><i class="is-active"></i><i></i><i></i></div>
    <button class="od-btn od-btn--block">Continue</button>
  </div>
</div>
