<!-- Uyjoy — apartment rentals. Sheet, layout a: filters over the search results, large detent. -->
<div class="od-page">
  <header class="od-header"><h1 class="od-header__title">Rentals</h1><p class="od-header__sub">Tashkent · 212 apartments</p></header>
  <div class="od-list">
    <div class="od-row od-row--media"><span class="od-row__lead"><img data-od-img="bright apartment living room with large windows" alt=""></span><span class="od-row__body"><span class="od-row__title">2-room flat, Mirobod</span><span class="od-row__sub">58 m² · 4th floor</span></span><span class="od-row__trail"><span class="od-price">$640</span></span></div>
    <div class="od-row od-row--media"><span class="od-row__lead"><img data-od-img="modern studio apartment with kitchen" alt=""></span><span class="od-row__body"><span class="od-row__title">Studio, Yunusobod</span><span class="od-row__sub">34 m² · 9th floor</span></span><span class="od-row__trail"><span class="od-price">$410</span></span></div>
  </div>
</div>
<div class="od-scrim"></div>
<div class="od-sheet od-sheet--overlay od-sheet--large">
  <div class="od-sheet__grabber"></div>
  <div class="od-sheet__head"><button class="od-btn od-btn--ghost">Reset</button><h2 class="od-sheet__title">Filters</h2><button class="od-icon-btn" aria-label="Close"><i data-lucide="x"></i></button></div>
  <span class="od-label">Sort by</span>
  <div class="od-segmented"><button class="is-active">Newest</button><button>Price</button><button>Size</button></div>
  <span class="od-label">Rooms</span>
  <div class="od-chips"><button class="od-chip">Studio</button><button class="od-chip is-active">1</button><button class="od-chip is-active">2</button><button class="od-chip">3</button><button class="od-chip">4+</button></div>
  <span class="od-label">District</span>
  <div class="od-chips"><button class="od-chip is-active">Mirobod</button><button class="od-chip">Yunusobod</button><button class="od-chip">Chilonzor</button><button class="od-chip is-active">Yakkasaroy</button></div>
  <span class="od-label">Price per month</span>
  <div class="od-form"><label class="od-form__field od-form__field--inline"><span class="od-form__label">From</span><input value="$300"></label><label class="od-form__field od-form__field--inline"><span class="od-form__label">To</span><input value="$700"></label></div>
  <div class="od-list">
    <label class="od-row od-row--compact"><span class="od-row__body"><span class="od-row__title">Pets allowed</span></span><input type="checkbox" class="od-switch" role="switch" checked></label>
    <label class="od-row od-row--compact"><span class="od-row__body"><span class="od-row__title">Available now</span></span><input type="checkbox" class="od-switch" role="switch"></label>
  </div>
  <button class="od-btn od-btn--block">Show 38 apartments</button>
</div>
