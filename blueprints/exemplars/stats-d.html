<!-- Language learning app (Spanish course): stats tab -->
<div class="od-page">
  <header class="od-header">
    <h1 class="od-header__title">Stats</h1>
  </header>
  <div class="od-segmented">
    <button class="is-active">Week</button>
    <button>Month</button>
    <button>All time</button>
  </div>
  <div class="od-bento">
    <div class="od-card od-bento__wide">
      <div class="od-stat od-stat--lg">
        <span class="od-stat__label">XP earned this week</span>
        <span class="od-stat__value">1,284</span>
        <span class="od-stat__delta od-stat__delta--up">+216 on last week</span>
      </div>
      <div data-od-chart="bar" data-values="150,180,120,210,160,312,152" data-labels="M,T,W,T,F,S,S" data-highlight="5"></div>
    </div>
    <div class="od-card">
      <div class="od-ring" style="--value:86%">
        <span class="od-ring__value">86%</span>
      </div>
      <span class="od-card__meta">of the 1,500 XP goal</span>
    </div>
    <div class="od-card">
      <div class="od-stat od-stat--sm">
        <span class="od-stat__icon"><i data-lucide="trophy"></i></span>
        <span class="od-stat__label od-stat__label--micro">Best day</span>
        <span class="od-stat__value">312 XP</span>
        <span class="od-stat__delta">Saturday</span>
      </div>
    </div>
    <div class="od-card">
      <div class="od-stat od-stat--sm">
        <span class="od-stat__icon"><i data-lucide="book-open"></i></span>
        <span class="od-stat__label od-stat__label--micro">New words</span>
        <span class="od-stat__value">86</span>
        <span class="od-stat__delta">52 mastered</span>
      </div>
    </div>
    <div class="od-card">
      <div class="od-stat od-stat--sm">
        <span class="od-stat__icon"><i data-lucide="users"></i></span>
        <span class="od-stat__label od-stat__label--micro">League</span>
        <span class="od-stat__value">4th</span>
        <span class="od-stat__delta od-stat__delta--up">Up 3 places</span>
      </div>
    </div>
  </div>
  <section class="od-section">
    <span class="od-label">By skill</span>
    <div class="od-list">
      <div class="od-row">
        <span class="od-row__lead"><i data-lucide="mic"></i></span>
        <span class="od-row__body"><span class="od-row__title">Speaking</span><span class="od-row__sub">14 lessons</span></span>
        <span class="od-row__trail">420 XP</span>
      </div>
      <div class="od-row">
        <span class="od-row__lead"><i data-lucide="headphones"></i></span>
        <span class="od-row__body"><span class="od-row__title">Listening</span><span class="od-row__sub">12 lessons</span></span>
        <span class="od-row__trail">368 XP</span>
      </div>
      <div class="od-row">
        <span class="od-row__lead"><i data-lucide="book-open-text"></i></span>
        <span class="od-row__body"><span class="od-row__title">Reading</span><span class="od-row__sub">9 stories</span></span>
        <span class="od-row__trail">306 XP</span>
      </div>
      <div class="od-row">
        <span class="od-row__lead"><i data-lucide="pen-line"></i></span>
        <span class="od-row__body"><span class="od-row__title">Writing</span><span class="od-row__sub">6 exercises</span></span>
        <span class="od-row__trail">190 XP</span>
      </div>
    </div>
  </section>
</div>
