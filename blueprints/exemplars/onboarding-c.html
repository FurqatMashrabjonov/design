<!-- Quill — a private journal. Onboarding, layout c: headline first, three benefit rows with icons, Continue. -->
<div class="od-page od-page--fill">
  <div class="od-stack">
    <img data-od-logo alt="">
    <h1 class="od-hero__title">A journal that keeps up with you</h1>
    <p class="od-hero__sub">Set up takes a minute. Nothing leaves your phone.</p>
  </div>
  <div class="od-list">
    <div class="od-row od-row--tall"><span class="od-row__lead"><i data-lucide="pen-line"></i></span><span class="od-row__body"><span class="od-row__title">Two minutes a day</span><span class="od-row__sub">One question each evening</span></span></div>
    <div class="od-row od-row--tall"><span class="od-row__lead"><i data-lucide="lock-keyhole"></i></span><span class="od-row__body"><span class="od-row__title">Only you can read it</span><span class="od-row__sub">Encrypted on this phone</span></span></div>
    <div class="od-row od-row--tall"><span class="od-row__lead"><i data-lucide="calendar-heart"></i></span><span class="od-row__body"><span class="od-row__title">Your year in moods</span><span class="od-row__sub">See which weeks lifted you</span></span></div>
  </div>
  <div class="od-actions">
    <div class="od-dots"><i class="is-active"></i><i></i><i></i></div>
    <button class="od-btn">Start writing</button>
    <button class="od-btn od-btn--ghost">I already have an account</button>
  </div>
</div>
