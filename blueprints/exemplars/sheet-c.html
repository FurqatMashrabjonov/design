<!-- Tally — a personal budget app. Sheet, layout c: quick add over the home tab, content-high. -->
<div class="od-page">
  <header class="od-header"><h1 class="od-header__title">October</h1><p class="od-header__sub">$1,240 left of $3,000</p></header>
  <div class="od-list">
    <div class="od-row"><span class="od-row__lead"><i data-lucide="shopping-basket"></i></span><span class="od-row__body"><span class="od-row__title">Chorsu market</span><span class="od-row__sub">Groceries · Today</span></span><span class="od-row__trail"><span class="od-price">−$38.20</span></span></div>
    <div class="od-row"><span class="od-row__lead"><i data-lucide="car"></i></span><span class="od-row__body"><span class="od-row__title">Taxi home</span><span class="od-row__sub">Transport · Today</span></span><span class="od-row__trail"><span class="od-price">−$4.10</span></span></div>
  </div>
</div>
<div class="od-scrim"></div>
<div class="od-sheet od-sheet--overlay">
  <div class="od-sheet__grabber"></div>
  <div class="od-sheet__head"><span></span><h2 class="od-sheet__title">New expense</h2><button class="od-icon-btn" aria-label="Close"><i data-lucide="x"></i></button></div>
  <label class="od-amount"><span class="od-amount__unit">$</span><input class="od-amount__field" inputmode="decimal" value="12.50"></label>
  <div class="od-chips"><button class="od-chip is-active">Cafés</button><button class="od-chip">Groceries</button><button class="od-chip">Transport</button></div>
  <div class="od-form">
    <label class="od-form__field"><span class="od-form__label">Note</span><input value="Lunch with Sardor"></label>
    <label class="od-form__field od-form__field--inline"><span class="od-form__label">Date</span><input value="Today, 13:20"></label>
  </div>
  <button class="od-btn od-btn--block">Add expense</button>
</div>
