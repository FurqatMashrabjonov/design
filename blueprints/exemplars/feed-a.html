<!-- Afisha — a city events app's home: chips, one tall featured card, then a stream of image cards -->
<div class="od-page">
  <header class="od-header">
    <div class="od-header__bar"><div class="od-header__actions"><button class="od-icon-btn" aria-label="Search"><i data-lucide="search"></i></button><button class="od-icon-btn" aria-label="Saved"><i data-lucide="heart"></i></button></div></div>
    <h1 class="od-header__title">This week</h1>
    <p class="od-header__sub">Tashkent · 48 events</p>
  </header>
  <div class="od-carousel"><button class="od-chip is-active">All</button><button class="od-chip">Concerts</button><button class="od-chip">Theatre</button><button class="od-chip">Stand-up</button><button class="od-chip">Markets</button></div>
  <a class="od-feature">
    <img data-od-img="jazz quartet on a dim stage" alt="Jazz quartet on stage">
    <div class="od-feature__top"><span class="od-tag">Tonight</span><button class="od-icon-btn" aria-label="Save"><i data-lucide="heart"></i></button></div>
    <div class="od-feature__body">
      <span class="od-feature__eyebrow">Jazz · 20:00</span>
      <h2 class="od-feature__title">Sevara Nazarkhan with the Ilkhom Quartet</h2>
      <p class="od-feature__meta">Ilkhom Theatre · from $18</p>
    </div>
  </a>
  <section class="od-section">
    <div class="od-section__head"><span class="od-label">Coming up</span><button class="od-section__link">Calendar</button></div>
    <a class="od-card od-card--media">
      <div class="od-media od-media--wide"><img data-od-img="ballet dancers on a grand stage" alt="Ballet on stage"></div>
      <div class="od-card__body"><p class="od-card__title">Swan Lake</p><p class="od-card__meta">Sat 27 Sep, 18:30 · Navoi Opera</p></div>
    </a>
    <a class="od-card od-card--media">
      <div class="od-media od-media--wide"><img data-od-img="night food market with string lights" alt="Night market"></div>
      <div class="od-card__body"><p class="od-card__title">Night Bazaar on Sayilgoh</p><p class="od-card__meta">Sun 28 Sep, 17:00 · Free entry</p></div>
    </a>
  </section>
</div>
