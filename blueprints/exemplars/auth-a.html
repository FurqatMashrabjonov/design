<!-- Daftar — a notes app's sign-in: welcome, provider buttons first, a divider, email, continue, passkey, terms -->
<div class="od-page od-page--fill">
  <div class="od-stack" style="align-items:center;text-align:center;padding-top:48px">
    <span class="od-empty__icon"><i data-lucide="notebook-pen"></i></span>
    <h1 class="od-hero__title">Welcome to Daftar</h1>
    <p class="od-hero__sub">Your notes, on every device.</p>
  </div>
  <div class="od-stack">
    <button class="od-btn od-btn--social"><i data-lucide="apple"></i>Continue with Apple</button>
    <button class="od-btn od-btn--social"><b aria-hidden="true">G</b>Continue with Google</button>
    <div class="od-divider od-divider--label">or</div>
    <label class="od-field"><span class="od-field__label">Email</span><input class="od-input" type="email" placeholder="you@example.com" autocomplete="email"></label>
    <button class="od-btn od-btn--block">Continue</button>
    <button class="od-btn od-btn--ghost"><i data-lucide="fingerprint"></i>Sign in with a passkey</button>
  </div>
  <p class="od-field__help" style="text-align:center">By continuing you accept the Terms and the Privacy Policy.</p>
</div>
