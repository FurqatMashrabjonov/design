</style>

<body><header data-od-id="screen-header" data-od-shell="detail-header" style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;height:56px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border)"><button type="button" data-od-back="Today" aria-label="Back to Today" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--fg);background:none;border:0;cursor:pointer"><svg data-od-icon width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h1 style="font-size:17px;font-weight:600;color:var(--fg);margin:0;letter-spacing:-0.01em">Add Habit</h1></header>

<div class="od-page" data-od-id="add-habit-step3">

  <!-- Step progress -->
  <div data-od-id="progress">
    <div class="step-track">
      <div class="step-item is-done">
        <span class="step-dot"><i data-lucide="check"></i></span>
        <span class="step-label">Details</span>
      </div>
      <div class="step-line is-done"></div>
      <div class="step-item is-done">
        <span class="step-dot"><i data-lucide="check"></i></span>
        <span class="step-label">Frequency</span>
      </div>
      <div class="step-line is-done"></div>
      <div class="step-item is-current">
        <span class="step-dot">3</span>
        <span class="step-label">Reminder</span>
      </div>
    </div>
  </div>

  <!-- Title -->
  <div data-od-id="hero">
    <p class="od-hero__eyebrow">Step 3 of 3</p>
    <h1 class="od-hero__title">Set a reminder</h1>
    <p class="od-hero__sub" style="color: var(--muted); font-size: var(--text-sm); line-height: var(--leading-body); margin-top: 4px;">
      A gentle nudge each day keeps the streak alive.
    </p>
  </div>

  <!-- Summary of prior steps -->
  <section class="od-section" data-od-id="summary">
    <div class="od-section__head">
      <h2 class="od-section__title">Your habit</h2>
    </div>
    <div class="od-card" style="padding: 14px; display: flex; align-items: center; gap: 12px;">
      <span class="icon-badge"><i data-lucide="activity"></i></span>
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 600; font-size: var(--text-base); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
          Evening Stretch
        </div>
        <div style="font-size: var(--text-xs); color: var(--muted); margin-top: 2px;">
          Wind-down routine
        </div>
      </div>
      <span class="od-tag">Daily</span>
    </div>
  </section>

  <!-- Reminder fields -->
  <section class="od-section" data-od-id="reminder">
    <div class="od-section__head">
      <h2 class="od-section__title">Reminder</h2>
    </div>
    <div class="od-stack">
      <div class="od-list">
        <div class="od-row">
          <span class="od-row__body">
            <span class="od-row__title">Daily reminder</span>
            <span class="od-row__sub">Get a nudge to check in</span>
          </span>
          <input type="checkbox" class="od-switch" role="switch" id="reminder-toggle" checked aria-label="Daily reminder">
        </div>
      </div>

      <label class="od-field" for="reminder-time">
        <span class="od-field__label">Reminder time</span>
        <button type="button" class="time-row" id="reminder-time" aria-label="Change reminder time, currently 8:00 PM">
          <span id="reminder-time-value">8:00 PM</span>
          <span class="chev"><i data-lucide="chevron-down"></i></span>
        </button>
        <span class="od-field__help" id="reminder-help">We'll send one notification a day at this time.</span>
      </label>
    </div>
  </section>

  <div class="bottom-spacer"></div>
</div>

<div class="od-bottom-bar" data-od-id="save-bar">
  <button class="od-btn" data-od-link="Today">Create habit</button>
</div>

<script>
  // Reminder toggle disables the time row
  const toggle = document.getElementById('reminder-toggle');
  const timeRow = document.getElementById('reminder-time');
  const help = document.getElementById('reminder-help');

  function syncReminderState() {
    if (toggle.checked) {
      timeRow.classList.remove('is-disabled');
      help.textContent = "We'll send one notification a day at this time.";
    } else {
      timeRow.classList.add('is-disabled');
      help.textContent = "Turn this on to get a daily nudge.";
    }
  }
  toggle.addEventListener('change', syncReminderState);
  syncReminderState();

  // Cycle through preset times on tap
  const times = ["7:00 AM", "8:00 AM", "12:00 PM", "6:00 PM", "8:00 PM", "9:30 PM"];
  let timeIndex = 4;
  const timeValue = document.getElementById('reminder-time-value');
  timeRow.addEventListener('click', () => {
    timeIndex = (timeIndex + 1) % times.length;
    timeValue.textContent = times[timeIndex];
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.47.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons({attrs:{'stroke-width':1.5}})</script></body>
</html>
