  .action-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: 56px;
    padding: var(--space-3) var(--space-4);
    width: 100%;
    background: transparent;
    border: 0;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .action-row:not(:last-child) {
    border-bottom: 1px solid var(--border);
  }
  .action-row:active {
    background: var(--surface-warm);
  }
  .action-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .action-icon i { width: 19px; height: 19px; }
  .action-icon.neutral {
    background: var(--surface-warm);
    color: var(--fg-2);
  }
  .action-icon.danger {
    background: color-mix(in oklab, var(--danger), transparent 90%);
    color: var(--danger);
  }
  .action-text {
    flex: 1;
    min-width: 0;
  }
  .action-title {
    display: block;
    font-size: var(--text-base);
    font-weight: 400;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .action-title.danger-text { color: var(--danger); }
  .action-sub {
    display: block;
    font-size: var(--text-xs);
    font-weight: 300;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .action-row > i.chev {
    width: 18px;
    height: 18px;
    color: var(--muted);
    flex-shrink: 0;
  }

  
  .price-block {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .price-label {
    font-size: var(--text-xs);
    font-weight: 300;
    color: var(--muted);
  }
  .price-value {
    font-size: var(--text-xl);
    font-weight: 300;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    letter-spacing: var(--tracking-display);
  }
  .primary-btn {
    height: 48px;
    padding: 0 var(--space-6);
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-on);
    border: 0;
    font-size: var(--text-base);
    font-weight: 400;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard);
    flex-shrink: 0;

  .primary-btn:hover { background: var(--accent-hover); }
  .primary-btn:active { background: var(--accent-active); }
  .primary-btn:focus-visible { box-shadow: var(--focus-ring); outline: none; }
  .primary-btn i { width: 18px; height: 18px; }

  .content-wrap {
    padding-bottom: 96px;

</style>
<link data-od-font rel="preconnect" href="https://fonts.googleapis.com"><link data-od-font rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link data-od-font rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><style data-od-hit-area>:where(button:not(.od-row--chevron):not(.od-timeline__item):not(.od-switch):not(.od-chip):not(.od-segmented):not(.od-btn--sm):not(.od-stepper):not(.od-section__link):has(> i[data-lucide]:only-child, > svg:only-child)){position:relative}button:not(.od-row--chevron):not(.od-timeline__item):not(.od-switch):not(.od-chip):not(.od-segmented):not(.od-btn--sm):not(.od-stepper):not(.od-section__link):has(> i[data-lucide]:only-child, > svg:only-child)::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}</style></head>
<body><header data-od-id="screen-header" data-od-shell="detail-header" style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;height:56px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border)"><button type="button" data-od-back="Transactions" aria-label="Back to Transactions" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--fg);background:none;border:0;cursor:pointer"><svg data-od-icon width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h1 style="font-size:17px;font-weight:600;color:var(--fg);margin:0;letter-spacing:-0.01em">Transaction Detail</h1></header>

<div class="content-wrap" data-od-id="transaction-detail">
  <div class="od-page">

    <!-- Hero: merchant thumbnail + title, amount, status -->
    <section data-od-id="hero">
      <div class="merchant-row">
        <div class="merchant-icon" aria-hidden="true">
          <i data-lucide="shopping-basket"></i>
        </div>
        <div class="merchant-title">
          <h1>Whole Foods</h1>
          <p>Whole Foods Market · Cape Town</p>
        </div>
      </div>

      <div class="amount-display">−$88.42</div>

      <div class="status-row">
        <span class="status-pill">
          <i data-lucide="check-circle-2"></i>
          Completed
        </span>
        <span class="meta-text">Sep 19, 2026 · 3:42 PM</span>
      </div>
    </section>

    <!-- Key facts -->
    <section data-od-id="facts">
      <h2 class="section-title">Details</h2>
      <div class="od-grid">
        <div class="fact-card">
          <span class="fact-label">Category</span>
          <span class="fact-value">Groceries</span>
        </div>
        <div class="fact-card">
          <span class="fact-label">Account</span>
          <span class="fact-value">Main Checking</span>
        </div>
        <div class="fact-card">
          <span class="fact-label">Card</span>
          <span class="fact-value">•••• 4821</span>
        </div>
        <div class="fact-card">
          <span class="fact-label">Reference</span>
          <span class="fact-value">WF‑88421‑0919</span>
        </div>
      </div>
    </section>

    <!-- Note / memo -->
    <section data-od-id="note">
      <h2 class="section-title">Note</h2>
      <div class="note-field">
        <label class="note-label" for="txn-note">Editable</label>
        <textarea id="txn-note" class="note-textarea" rows="2" aria-label="Transaction note">Weekly grocery run — added avocados and coffee.</textarea>
      </div>
    </section>

    <!-- Actions -->
    <section data-od-id="actions">
      <h2 class="section-title">Actions</h2>
      <div class="action-list">
        <button class="action-row" id="btn-dispute" type="button">
          <span class="action-icon danger" aria-hidden="true"><i data-lucide="flag"></i></span>
          <span class="action-text">
            <span class="action-title danger-text">Dispute transaction</span>
            <span class="action-sub">Report an issue with this charge</span>
          </span>
          <i data-lucide="chevron-right" class="chev"></i>
        </button>
        <button class="action-row" id="btn-split" type="button">
          <span class="action-icon neutral" aria-hidden="true"><i data-lucide="users"></i></span>
          <span class="action-text">
            <span class="action-title">Split transaction</span>
            <span class="action-sub">Share this cost with someone</span>
          </span>
          <i data-lucide="chevron-right" class="chev"></i>
        </button>
      </div>
    </section>

  </div>
</div>

<!-- Sticky primary action bar -->
<div class="od-bottom-bar" data-od-id="bottom-bar">
  <div class="price-block">
    <span class="price-label">Amount</span>
    <span class="price-value">−$88.42</span>
  </div>
  <button class="primary-btn" id="btn-download" type="button">
    <i data-lucide="download"></i>
    <span id="btn-download-label">Download receipt</span>
  </button>
</div>

<script>
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }

  var downloadBtn = document.getElementById('btn-download');
  var downloadLabel = document.getElementById('btn-download-label');
  if (downloadBtn) {
    downloadBtn.addEventListener('click', function () {
      downloadLabel.textContent = 'Receipt sent';
      downloadBtn.disabled = true;
      setTimeout(function () {
        downloadLabel.textContent = 'Download receipt';
        downloadBtn.disabled = false;
      }, 1800);
    });
  }

  var disputeBtn = document.getElementById('btn-dispute');
  if (disputeBtn) {
    disputeBtn.addEventListener('click', function () {
      disputeBtn.style.opacity = '0.6';
      setTimeout(function () { disputeBtn.style.opacity = '1'; }, 200);
    });
  }

  var splitBtn = document.getElementById('btn-split');
  if (splitBtn) {
    splitBtn.addEventListener('click', function () {
      splitBtn.style.opacity = '0.6';
      setTimeout(function () { splitBtn.style.opacity = '1'; }, 200);
    });
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.47.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons({attrs:{'stroke-width':2}})</script></body>
</html>
