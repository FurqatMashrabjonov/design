<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Result</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg: #08090a; --surface: #111214; --surface-warm: #17181b; --fg: #f7f8f8; --fg-2: #c4c7cb; --muted: #8a8f98; --meta: #5c6068; --border: rgba(255, 255, 255, 0.08); --border-soft: rgba(255, 255, 255, 0.04); --border-strong: rgba(255, 255, 255, 0.14); --accent: #5e6ad2; --accent-on: #ffffff; --accent-hover: color-mix(in oklab, var(--accent), white 10%); --accent-active: color-mix(in oklab, var(--accent), black 12%); --success: #4cb782; --warn: #f2c94c; --danger: #eb5757; --warning: var(--warn); --muted-2: var(--meta); --surface-hover: var(--surface-warm); --font-display: "Inter", -apple-system, "Segoe UI", Arial, sans-serif; --font-body: "Inter", -apple-system, "Segoe UI", Arial, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-lg: 16px; --text-xl: 20px; --text-2xl: 28px; --text-3xl: 40px; --text-4xl: 56px; --leading-body: 1.5; --leading-tight: 1.1; --tracking-display: -0.025em; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-12: 48px; --section-y-desktop: 88px; --section-y-tablet: 56px; --section-y-phone: 40px; --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-pill: 9999px; --elev-flat: none; --elev-ring: 0 0 0 1px var(--border); --elev-raised: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 0 0 1px var(--border); --focus-ring: 0 0 0 3px color-mix(in oklab, var(--accent), transparent 60%); --icon-stroke: 1.5; --motion-fast: 120ms; --motion-base: 180ms; --ease-standard: cubic-bezier(0.2, 0, 0, 1); --container-max: 1100px; --container-gutter-desktop: 24px; --container-gutter-tablet: 16px; --container-gutter-phone: 16px; --od-card-shadow: none; --od-card-border: 1px solid var(--border) }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }

  .screen-root {
    min-height: 100vh;
    background: var(--bg);
    padding-bottom: 132px; /* bottom bar height + safe gap */
  }

  .result-wrap {
    padding: 40px var(--space-4) var(--space-6);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: var(--space-5);
  }

  .success-mark {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in oklab, var(--success), transparent 85%);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--success), transparent 55%);
    margin-top: var(--space-2);
  }
  .success-mark i {
    width: 34px;
    height: 34px;
    color: var(--success);
    stroke-width: 2;
  }

  .headline {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--text-2xl);
    line-height: var(--leading-tight);
    letter-spacing: var(--tracking-display);
    color: var(--fg);
    margin: 0;
  }

  .subline {
    font-size: var(--text-sm);
    line-height: var(--leading-body);
    color: var(--muted);
    margin: 0;
    max-width: 300px;
  }

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-pill);
    background: color-mix(in oklab, var(--success), transparent 85%);
    color: var(--success);
    font-size: var(--text-xs);
    font-weight: 500;
    border: 1px solid color-mix(in oklab, var(--success), transparent 65%);
  }
  .status-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  .summary-card {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius-md);
    box-shadow: var(--elev-raised);
    padding: var(--space-4);
    text-align: left;
    margin-top: var(--space-2);
  }

  .summary-head {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding-bottom: var(--space-4);
    margin-bottom: var(--space-4);
    border-bottom: 1px solid var(--border);
  }
  .asset-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-warm);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px var(--border);
    flex: none;
  }
  .asset-icon i {
    width: 20px;
    height: 20px;
    color: var(--warn);
    stroke-width: 1.5;
  }
  .summary-head-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .summary-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--text-base);
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .summary-sub {
    font-size: var(--text-xs);
    color: var(--meta);
    font-weight: 500;
  }

  .kv-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-2) 0;
  }
  .kv-row + .kv-row {
    border-top: 1px solid var(--border-soft);
  }
  .kv-label {
    font-size: var(--text-xs);
    color: var(--muted);
    font-weight: 500;
  }
  .kv-value {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: var(--text-sm);
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .kv-row.total .kv-label {
    color: var(--fg-2);
    font-weight: 600;
  }
  .kv-row.total .kv-value {
    font-size: var(--text-lg);
    color: var(--fg);
    font-weight: 600;
  }
  .kv-row.total {
    margin-top: var(--space-1);
    padding-top: var(--space-3);
    border-top: 1px solid var(--border);
  }

  .timestamp-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    padding: var(--space-3) var(--space-4);
    background: var(--surface-warm);
    border-radius: var(--radius-md);
    box-shadow: var(--elev-ring);
    margin-top: -4px;
  }
  .timestamp-row i {
    width: 16px;
    height: 16px;
    color: var(--meta);
    stroke-width: 1.5;
  }
  .timestamp-text {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--meta);
    font-variant-numeric: tabular-nums;
  }

  .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: var(--space-4);
    padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-3);
    z-index: 40;
  }

  .btn-primary {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-on);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--text-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { background: var(--accent-active); }
  .btn-primary:focus-visible { outline: none; box-shadow: var(--focus-ring); }

  .btn-text {
    background: none;
    border: none;
    color: var(--muted);
    font-size: var(--text-sm);
    font-weight: 500;
    font-family: var(--font-body);
    cursor: pointer;
    padding: var(--space-2) var(--space-3);
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  .btn-text:hover { color: var(--fg-2); }
  .btn-text:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
</style>
<link data-od-font rel="preconnect" href="https://fonts.googleapis.com"><link data-od-font rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link data-od-font rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"><style data-od-hit-area>:where(button:has(> i[data-lucide]:only-child, > svg:only-child)){position:relative}button:has(> i[data-lucide]:only-child, > svg:only-child)::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}</style></head>
<body><header data-od-id="screen-header" data-od-shell="detail-header" style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;height:56px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border)"><button type="button" data-od-back="Coin Detail" aria-label="Back to Coin Detail" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--fg);background:none;border:0;cursor:pointer"><svg data-od-icon width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h1 style="font-size:17px;font-weight:600;color:var(--fg);margin:0;letter-spacing:-0.01em">Order Result</h1></header>

<div class="screen-root" data-od-id="order-result">

  <div class="result-wrap" data-od-id="status-header">
    <div class="success-mark" aria-hidden="true">
      <i data-lucide="check"></i>
    </div>
    <h1 class="headline">Order completed</h1>
    <p class="subline">Your purchase of Bitcoin has been executed and settled to your portfolio.</p>
    <span class="status-chip"><span class="dot" aria-hidden="true"></span>Completed</span>
  </div>

  <div style="padding: 0 var(--space-4);">
    <div class="summary-card" data-od-id="order-summary">
      <div class="summary-head">
        <div class="asset-icon" aria-hidden="true">
          <i data-lucide="bitcoin"></i>
        </div>
        <div class="summary-head-text">
          <span class="summary-title">Buy Bitcoin</span>
          <span class="summary-sub">BTC · Market order</span>
        </div>
      </div>

      <div class="kv-row">
        <span class="kv-label">Amount</span>
        <span class="kv-value">0.05000 BTC</span>
      </div>
      <div class="kv-row">
        <span class="kv-label">Price per BTC</span>
        <span class="kv-value">$63,250.18</span>
      </div>
      <div class="kv-row">
        <span class="kv-label">Network fee</span>
        <span class="kv-value">$1.98</span>
      </div>
      <div class="kv-row total">
        <span class="kv-label">Total paid</span>
        <span class="kv-value">$3,164.49</span>
      </div>
    </div>
  </div>

  <div style="padding: 0 var(--space-4);">
    <div class="timestamp-row" data-od-id="transaction-timestamp">
      <i data-lucide="clock"></i>
      <span class="timestamp-text">Sep 22, 2026 · 14:32 IST</span>
    </div>
  </div>

</div>

<div class="bottom-bar" data-od-id="actions">
  <button class="btn-primary" data-od-link="Home">Return to portfolio</button>
  <a href="#" class="btn-text" data-od-link="Home">View in transaction history</a>
</div>

<script>
  if (window.lucide) {
    lucide.createIcons();
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.47.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons({attrs:{'stroke-width':1.5}})</script></body>
</html>
