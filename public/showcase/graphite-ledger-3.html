    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  }

  .keypad-hero__hint {
    font-size: var(--text-xs);
    color: var(--meta);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Grouped inset rows ---- */
  .group {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }

  .group__label {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--muted);
    padding-left: 2px;
  }

  .group__rows {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--elev-raised);
    overflow: hidden;
  }

  .inset-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: 52px;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border-soft);
  }

  .inset-row:last-child {
    border-bottom: none;
  }

  .inset-row__icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    border-radius: var(--radius-sm);
    background: var(--surface-warm);
    color: var(--fg-2);
  }

  .inset-row__icon svg {
    width: 18px;
    height: 18px;
  }

  .inset-row__label {
    flex: 0 0 auto;
    font-size: var(--text-base);
    color: var(--fg-2);
    font-weight: 450;
  }

  .inset-row__spacer {
    flex: 1 1 auto;
    min-width: var(--space-2);
  }

  .inset-row__value {
    flex: 0 1 auto;
    max-width: 58%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
    font-size: var(--text-base);
    color: var(--fg);
    font-weight: 500;
  }

  .inset-row__value.is-placeholder {
    color: var(--meta);
    font-weight: 400;
  }

  .inset-row__chevron {
    display: flex;
    align-items: center;
    color: var(--meta);
    flex: 0 0 auto;
  }

  .inset-row__chevron svg {
    width: 18px;
    height: 18px;
  }

  .inset-row input.inset-input {
    flex: 1 1 auto;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    text-align: right;
    font-family: var(--font-body);
    font-size: var(--text-base);
    color: var(--fg);
    padding: 0;
    min-height: 24px;
  }

  .inset-row input.inset-input::placeholder {
    color: var(--meta);
  }

  .inset-row input.inset-input:focus-visible {
    outline: none;
  }

  .inset-row.is-focus {
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  /* ---- Category picker rows ---- */
  .cat-option {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    width: 100%;
    min-height: 52px;
    padding: var(--space-3) var(--space-4);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-soft);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: var(--text-base);
    text-align: left;
    cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard);
  }

  .cat-option:last-child {
    border-bottom: none;
  }

  .cat-option:active {
    background: var(--surface-warm);
  }

  .cat-option__check {
    margin-left: auto;
    color: var(--od-accent-text);
    opacity: 0;
    display: flex;
    align-items: center;
  }

  .cat-option.is-selected .cat-option__check {
    opacity: 1;
  }

  .cat-option.is-selected .cat-option__name {
    color: var(--od-accent-text);
    font-weight: 600;
  }

  .cat-option__name {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cat-option__meta {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: var(--text-sm);
    color: var(--meta);
  }

  /* ---- Note textarea ---- */
  .note-row {
    padding: var(--space-3) var(--space-4) var(--space-4);
    border-top: none;
  }

  textarea.inset-note {
    display: block;
    width: 100%;
    min-height: 72px;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: var(--leading-body);
    padding: 0;
  }

  textarea.inset-note::placeholder {
    color: var(--meta);
  }

  textarea.inset-note:focus-visible {
    outline: none;
  }

  /* ---- Receipt attach ---- */
  .receipt-btn {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    width: 100%;
    min-height: 52px;
    padding: var(--space-3) var(--space-4);
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius-md);
    color: var(--fg-2);
    font-family: var(--font-body);
    font-size: var(--text-base);
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  }

  .receipt-btn:active {
    background: var(--surface-warm);
    border-color: var(--accent);
  }

  .receipt-btn__icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    border-radius: var(--radius-sm);
    background: var(--surface-warm);
    color: var(--fg-2);
  }

  .receipt-btn__icon svg {
    width: 18px;
    height: 18px;
  }

  .receipt-btn__meta {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    color: var(--meta);
    font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }

  

  .od-bottom-bar .od-btn {
    min-height: 50px;
    font-size: var(--text-base);
    font-weight: 600;
  }

  /* ---- Helper line ---- */
  .helper {
    font-size: var(--text-xs);
    color: var(--meta);
    padding-left: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .helper svg {
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
  }

  /* focus ring on all interactive elements */
  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
    border-radius: var(--radius-sm);
  }
</style>

<main class="page" data-od-id="add-expense-form">

  <!-- 1. Amount keypad with currency -->
  <section class="keypad-hero" data-od-id="amount-pad" aria-label="Amount">
    <span class="keypad-hero__label">Amount spent</span>
    <div class="keypad-hero__amount" data-od-id="hero">
      <span class="keypad-hero__currency">$</span>
      <span id="amount-display">0.00</span><span class="keypad-hero__caret" aria-hidden="true"></span>
    </div>
    <span class="keypad-hero__hint">March 2025 · Portland</span>
  </section>

  <!-- 2. Merchant field -->
  <section class="group" data-od-id="merchant" aria-label="Merchant">
    <h2 class="group__label">Merchant</h2>
    <div class="group__rows">
      <div class="inset-row" id="merchant-row" data-od-id="merchant-row">
        <span class="inset-row__icon"><i data-lucide="store"></i></span>
        <span class="inset-row__label">Paid to</span>
        <span class="inset-row__spacer"></span>
        <input class="inset-input" id="merchant-input" type="text" placeholder="Café Lumière" autocomplete="off" aria-label="Merchant name">
      </div>
    </div>
  </section>

  <!-- 3. Category picker -->
  <section class="group" data-od-id="category" aria-label="Category">
    <h2 class="group__label">Category</h2>
    <div class="group__rows" role="radiogroup" aria-label="Category">
      <button class="cat-option is-selected" role="radio" aria-checked="true" data-category="Meals">
        <span class="inset-row__icon"><i data-lucide="utensils"></i></span>
        <span class="cat-option__name">Meals</span>
        <span class="cat-option__meta">$42.80 · 18%</span>
        <span class="cat-option__check"><i data-lucide="check"></i></span>
      </button>
      <button class="cat-option" role="radio" aria-checked="false" data-category="Software">
        <span class="inset-row__icon"><i data-lucide="app-window"></i></span>
        <span class="cat-option__name">Software</span>
        <span class="cat-option__meta">$69.99 · 29%</span>
        <span class="cat-option__check"><i data-lucide="check"></i></span>
      </button>
      <button class="cat-option" role="radio" aria-checked="false" data-category="Office">
        <span class="inset-row__icon"><i data-lucide="printer"></i></span>
        <span class="cat-option__name">Office</span>
        <span class="cat-option__meta">$64.20 · 27%</span>
        <span class="cat-option__check"><i data-lucide="check"></i></span>
      </button>
      <button class="cat-option" role="radio" aria-checked="false" data-category="Workspace">
        <span class="inset-row__icon"><i data-lucide="building-2"></i></span>
        <span class="cat-option__name">Workspace</span>
        <span class="cat-option__meta">$28.00 · 12%</span>
        <span class="cat-option__check"><i data-lucide="check"></i></span>
      </button>
    </div>
  </section>

  <!-- 4. Date and note -->
  <section class="group" data-od-id="date-note" aria-label="Date and note">
    <h2 class="group__label">Date &amp; note</h2>
    <div class="group__rows">
      <div class="inset-row">
        <span class="inset-row__icon"><i data-lucide="calendar"></i></span>
        <span class="inset-row__label">Date</span>
        <span class="inset-row__spacer"></span>
        <span class="inset-row__value">Sep 24, 2026</span>
        <span class="inset-row__chevron"><i data-lucide="chevron-right"></i></span>
      </div>
      <div class="note-row">
        <textarea class="inset-note" id="note-input" placeholder="Note (optional) — e.g. lunch with Acme Co" aria-label="Note"></textarea>
      </div>
    </div>
  </section>

  <!-- 5. Receipt attach -->
  <section class="group" data-od-id="receipt" aria-label="Receipt">
    <h2 class="group__label">Receipt</h2>
    <button class="receipt-btn" id="receipt-btn" type="button">
      <span class="receipt-btn__icon"><i data-lucide="paperclip"></i></span>
      <span id="receipt-label">Attach receipt</span>
      <span class="receipt-btn__meta">PDF or JPG</span>
    </button>
    <p class="helper"><i data-lucide="info"></i>Receipts are stored in Plum Ledger and can be replaced later.</p>
  </section>

</main>

<!-- Primary action: Save expense -->
<div class="od-bottom-bar" data-od-id="save-bar">
  <button class="od-btn od-btn--block" id="save-btn" data-od-link="This Month" type="button">Save expense</button>
</div>

<script>
  // Amount keypad rendering
  const amountDisplay = document.getElementById('amount-display');
  let amountCents = 0;
  function renderAmount() {
    amountDisplay.textContent = (amountCents / 100).toFixed(2);
  }
  renderAmount();

  // Category selection
  const catButtons = document.querySelectorAll('.cat-option');
  catButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      catButtons.forEach(b => {
        b.classList.remove('is-selected');
        b.setAttribute('aria-checked', 'false');
      });
      btn.classList.add('is-selected');
      btn.setAttribute('aria-checked', 'true');
    });
  });

  // Receipt attach toggle (visual state only)
  const receiptBtn = document.getElementById('receipt-btn');
  const receiptLabel = document.getElementById('receipt-label');
  let attached = false;
  receiptBtn.addEventListener('click', () => {
    attached = !attached;
    receiptLabel.textContent = attached ? 'receipt-sep24.jpg' : 'Attach receipt';
    receiptBtn.style.borderStyle = attached ? 'solid' : 'dashed';
    receiptBtn.style.borderColor = attached ? 'var(--accent)' : 'var(--border)';
  });
</script>
