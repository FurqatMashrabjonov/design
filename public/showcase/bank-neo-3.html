<body><header data-od-id="screen-header" data-od-shell="detail-header" style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;height:56px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border)"><button type="button" data-od-back="Home" aria-label="Back to Home" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--fg);background:none;border:0;cursor:pointer"><svg data-od-icon width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h1 style="font-size:17px;font-weight:600;color:var(--fg);margin:0;letter-spacing:-0.01em">Send Money</h1></header>

<div class="od-page" data-od-id="send-money">

  <section class="od-section" data-od-id="recipient">
    <h2 class="od-section__title">Recipient</h2>
    <div class="od-search" role="search" data-od-id="search">
      <i data-lucide="search"></i>
      <input type="text" inputmode="text" placeholder="Search name or @handle" aria-label="Search recipient">
    </div>
  </section>

  <section class="od-section" data-od-id="contacts">
    <h2 class="od-section__title">Recent contacts</h2>
    <div class="contacts-list" id="contactsList" data-od-id="contactslist">
      <button type="button" class="contact-row is-selected" data-name="Sarah Chen" data-handle="@sarahc" data-bank="Chase Bank">
        <span role="img" aria-label="Sarah Chen" data-od-avatar-resolved class="od-avatar" style="width:40px;height:40px;border-radius:9999px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--fg);border:1px solid var(--border);font-weight:600;font-size:0.8em;line-height:1">SC</span>
        <span class="contact-body">
          <span class="contact-name">Sarah Chen</span>
          <span class="contact-meta">@sarahc · Chase Bank</span>
        </span>
        <span class="contact-check" aria-hidden="true"><i data-lucide="check-circle-2"></i></span>
      </button>
      <button type="button" class="contact-row" data-name="Mike Torres" data-handle="@miketorres" data-bank="Wells Fargo">
        <span role="img" aria-label="Mike Torres" data-od-avatar-resolved class="od-avatar" style="width:40px;height:40px;border-radius:9999px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--fg);border:1px solid var(--border);font-weight:600;font-size:0.8em;line-height:1">MT</span>
        <span class="contact-body">
          <span class="contact-name">Mike Torres</span>
          <span class="contact-meta">@miketorres · Wells Fargo</span>
        </span>
        <span class="contact-check" aria-hidden="true"><i data-lucide="check-circle-2"></i></span>
      </button>
      <button type="button" class="contact-row" data-name="Aisha Patel" data-handle="@aishap" data-bank="Bank of America">
        <span role="img" aria-label="Aisha Patel" data-od-avatar-resolved class="od-avatar" style="width:40px;height:40px;border-radius:9999px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--fg);border:1px solid var(--border);font-weight:600;font-size:0.8em;line-height:1">AP</span>
        <span class="contact-body">
          <span class="contact-name">Aisha Patel</span>
          <span class="contact-meta">@aishap · Bank of America</span>
        </span>
        <span class="contact-check" aria-hidden="true"><i data-lucide="check-circle-2"></i></span>
      </button>
      <button type="button" class="contact-row" data-name="David Kim" data-handle="@davidkim" data-bank="Citibank">
        <span role="img" aria-label="David Kim" data-od-avatar-resolved class="od-avatar" style="width:40px;height:40px;border-radius:9999px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--fg);border:1px solid var(--border);font-weight:600;font-size:0.8em;line-height:1">DK</span>
        <span class="contact-body">
          <span class="contact-name">David Kim</span>
          <span class="contact-meta">@davidkim · Citibank</span>
        </span>
        <span class="contact-check" aria-hidden="true"><i data-lucide="check-circle-2"></i></span>
      </button>
    </div>
  </section>

  <section class="od-section" data-od-id="amount">
    <h2 class="od-section__title">Amount</h2>
    <div class="amount-section">
      <div class="amount-display" id="amountDisplay" aria-live="polite" data-od-id="amountdisplay">$0.00</div>
      <div class="keypad" role="group" aria-label="Amount keypad">
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="key-dot" tabindex="-1" aria-hidden="true">.</button>
        <button type="button" data-digit="0">0</button>
        <button type="button" class="key-back" id="backspaceBtn" aria-label="Delete last digit"><i data-lucide="delete"></i></button>
      </div>
    </div>
  </section>

  <section class="od-section" data-od-id="note">
    <h2 class="od-section__title">Note</h2>
    <label class="od-field">
      <span class="od-field__label">Add a note (optional)</span>
      <input class="od-input" type="text" placeholder="e.g. Weekend trip split" maxlength="60">
      <span class="od-field__help note-help">Visible to <span id="noteRecipient">Sarah Chen</span></span>
    </label>
  </section>

  <section class="od-section" data-od-id="account">
    <h2 class="od-section__title">From</h2>
    <button type="button" class="account-row" id="accountRow">
      <span class="icon-tile"><i data-lucide="wallet"></i></span>
      <span class="account-body">
        <span class="account-title" id="accountTitle">Main Checking</span>
        <span class="account-sub" id="accountSub">•••• 4821 · $4,285.30 available</span>
      </span>
      <span class="account-trail"><i data-lucide="chevron-down"></i></span>
    </button>
  </section>

</div>

<div class="od-bottom-bar" data-od-id="cta">
  <button class="od-btn od-btn--block" type="button" id="sendBtn" data-od-link="Send Result">Review &amp; Send</button>
</div>

<script>
  // ---- Contact selection ----
  var contactRows = document.querySelectorAll('.contact-row');
  var noteRecipientEl = document.getElementById('noteRecipient');
  contactRows.forEach(function (row) {
    row.addEventListener('click', function () {
      contactRows.forEach(function (r) { r.classList.remove('is-selected'); });
      row.classList.add('is-selected');
      noteRecipientEl.textContent = row.getAttribute('data-name');
    });
  });

  // ---- Account picker (cycles between two accounts) ----
  var accounts = [
    { title: 'Main Checking', sub: '•••• 4821 · $4,285.30 available' },
    { title: 'Savings', sub: '•••• 7734 · $12,900.00 available' }
  ];
  var accountIndex = 0;
  var accountRow = document.getElementById('accountRow');
  var accountTitleEl = document.getElementById('accountTitle');
  var accountSubEl = document.getElementById('accountSub');
  accountRow.addEventListener('click', function () {
    accountIndex = (accountIndex + 1) % accounts.length;
    accountTitleEl.textContent = accounts[accountIndex].title;
    accountSubEl.textContent = accounts[accountIndex].sub;
  });

  // ---- Amount keypad ----
  var raw = '';
  var amountDisplay = document.getElementById('amountDisplay');
  function renderAmount() {
    var cents = raw === '' ? 0 : parseInt(raw, 10);
    var dollars = (cents / 100).toFixed(2);
    amountDisplay.textContent = '$' + dollars;
  }
  document.querySelectorAll('.keypad button[data-digit]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (raw.length < 7) {
        raw += btn.getAttribute('data-digit');
        renderAmount();
      }
    });
  });
  document.getElementById('backspaceBtn').addEventListener('click', function () {
    raw = raw.slice(0, -1);
    renderAmount();
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.47.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons({attrs:{'stroke-width':2}})</script></body>
</html>
