  .hq-body { flex: 1; min-width: 0; }
  .hq-name {
    display: flex; align-items: center; gap: 6px;
    font-size: var(--text-sm);
    font-weight: 500;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hq-name-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid color-mix(in oklab, var(--accent), transparent 45%);
    border-radius: var(--radius-pill);
    padding: 1px 6px;
    flex: 0 0 auto;
  }
  .hq-streak {
    display: flex; align-items: center; gap: 4px;
    font-size: var(--text-xs);
    color: var(--meta);
    margin-top: 2px;
  }
  .hq-streak i { width: 13px; height: 13px; color: var(--meta); }
  .hq-trail {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: var(--space-2);
  }
  .hq-xp {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: var(--text-sm);
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }
  .hq-xp span {
    font-size: 11px;
    color: var(--meta);
    font-weight: 500;
    margin-left: 2px;
  }
  .hq-cheer {
    width: 36px; height: 36px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--surface-warm);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
  }
  .hq-cheer i { width: 16px; height: 16px; }
  .hq-cheer:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .hq-cheer.is-cheered {
    background: color-mix(in oklab, var(--success), transparent 85%);
    border-color: color-mix(in oklab, var(--success), transparent 55%);
    color: var(--success);
  }

  .hq-bottombar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: var(--space-3) var(--space-4) calc(var(--space-3) + 4px);
  }
  .hq-btn-primary {
    width: 100%;
    min-height: 48px;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-on);
    border: none;
    font-size: var(--text-sm);
    font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .hq-btn-primary:hover { background: var(--accent-hover); }
  .hq-btn-primary:active { background: var(--accent-active); }
  .hq-btn-primary:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .hq-btn-primary i { width: 18px; height: 18px; }

  .hq-segmented {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
    gap: 3px;
  }
  .hq-segmented button {
    flex: 1;
    min-height: 38px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: var(--text-sm);
    font-weight: 500;
    border-radius: calc(var(--radius-sm) - 2px);
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .hq-segmented button.is-active {
    background: var(--surface-warm);
    color: var(--fg);
    box-shadow: var(--elev-ring);
  }
  .hq-segmented button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
</style>
<link data-od-font rel="preconnect" href="https://fonts.googleapis.com"><link data-od-font rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link data-od-font rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"><style data-od-hit-area>:where(button:not(.od-row--chevron):not(.od-timeline__item):not(.od-switch):not(.od-chip):not(.od-segmented):not(.od-btn--sm):not(.od-stepper):not(.od-section__link):has(> i[data-lucide]:only-child, > svg:only-child)){position:relative}button:not(.od-row--chevron):not(.od-timeline__item):not(.od-switch):not(.od-chip):not(.od-segmented):not(.od-btn--sm):not(.od-stepper):not(.od-section__link):has(> i[data-lucide]:only-child, > svg:only-child)::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}</style></head>
<body><header data-od-id="screen-header" data-od-shell="detail-header" style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;height:56px;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border)"><button type="button" data-od-back="Today — HabitQuest" aria-label="Back to Today — HabitQuest" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--fg);background:none;border:0;cursor:pointer"><svg data-od-icon width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><h1 style="font-size:17px;font-weight:600;color:var(--fg);margin:0;letter-spacing:-0.01em">Leaderboard — HabitQuest</h1></header>

<div class="od-page" data-od-id="leaderboard-screen" style="padding-top:16px;">

  <!-- Summary -->
  <section class="hq-summary" data-od-id="summary">
    <div class="hq-summary__text">
      <div class="hq-summary__level">LEVEL 8</div>
      <div class="hq-summary__xp">6,510<span>XP total</span></div>
      <div class="hq-summary__sub">990 XP to Level 9</div>
    </div>
    <div class="hq-ring-wrap">
      <div data-od-chart="ring" data-values="6510" data-max="7500" unit="" data-labels="to Lvl 9" data-od-chart-rendered style="display:flex;flex-direction:column;width:88px;height:88px;"><div style="position:relative;height:100%;aspect-ratio:1;max-height:180px;margin:0 auto"><svg viewBox="0 0 42 42" style="width:100%;height:100%;transform:rotate(-90deg)" aria-hidden="true"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--border)" stroke-width="3.5"/><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="86.8 13.2"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1"><strong style="font-size:clamp(14px,22%,32px);color:var(--fg);font-variant-numeric:tabular-nums">6510</strong><span style="font-size:11px;color:var(--muted)">to Lvl 9</span></div></div></div>
    </div>
  </section>

  <!-- Encouragement banner -->
  <section class="hq-banner" data-od-id="nudge-banner">
    <div class="hq-banner__icon" data-od-id="banner"><i data-lucide="trending-up"></i></div>
    <p id="bannerText">You're <strong>35 XP</strong> behind Elliot Raman for #2 this week. One more check-in closes the gap.</p>
  </section>

  <!-- Segmented control -->
  <div class="hq-segmented" data-od-id="segmented" role="tablist" aria-label="Leaderboard range">
    <button type="button" class="is-active" id="segWeek" role="tab" aria-selected="true">This week</button>
    <button type="button" id="segAll" role="tab" aria-selected="false">All time</button>
  </div>

  <!-- Leaderboard list -->
  <section data-od-id="leaderboard-list">
    <div class="hq-section-label">
      <span>Friends ranking</span>
      <span id="rangeLabel">Weekly XP</span>
    </div>
    <div class="hq-list" id="listContainer" data-od-id="listcontainer"></div>
  </section>

</div>

<!-- Primary action -->
<div class="hq-bottombar" data-od-id="invite-bar">
  <button type="button" class="hq-btn-primary" id="inviteBtn">
    <i data-lucide="user-plus"></i>
    Invite a friend
  </button>
</div>

<script>
  lucide.createIcons();

  const week = [
    { rank: 1, name: "Yuki Vos", xp: 620, streak: 22, you: false },
    { rank: 2, name: "Elliot Raman", xp: 540, streak: 14, you: false },
    { rank: 3, name: "Leila Lindqvist", xp: 505, streak: 30, you: true },
    { rank: 4, name: "Priya Marino", xp: 430, streak: 9, you: false },
    { rank: 5, name: "Oskar Okafor", xp: 360, streak: 6, you: false },
    { rank: 6, name: "Jonas Quint", xp: 290, streak: 4, you: false },
    { rank: 7, name: "Ximena Ashby", xp: 210, streak: 2, you: false }
  ];

  const allTime = [
    { rank: 1, name: "Elliot Raman", xp: 8240, streak: 14, you: false },
    { rank: 2, name: "Yuki Vos", xp: 7960, streak: 22, you: false },
    { rank: 3, name: "Leila Lindqvist", xp: 6510, streak: 30, you: true },
    { rank: 4, name: "Priya Marino", xp: 5120, streak: 9, you: false },
    { rank: 5, name: "Jonas Quint", xp: 4780, streak: 4, you: false },
    { rank: 6, name: "Oskar Okafor", xp: 4300, streak: 6, you: false },
    { rank: 7, name: "Ximena Ashby", xp: 2950, streak: 2, you: false }
  ];

  const cheeredState = {};

  function avatarTag(name) {
    return `<span role="img" aria-label="${name}" data-od-avatar-resolved class="hq-avatar" style="width:40px;height:40px;border-radius:9999px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--fg);border:1px solid var(--border);font-weight:600;font-size:0.8em;line-height:1">$</span>`;
  }

  function renderList(data) {
    const container = document.getElementById('listContainer');
    container.innerHTML = data.map(p => {
      const topClass = p.rank <= 3 ? 'hq-rank--top' : '';
      const rowClass = p.you ? 'hq-row hq-row--you' : 'hq-row';
      const nameTag = p.you ? '<span class="hq-name-tag">You</span>' : '';
      const trail = p.you
        ? `<span class="hq-xp">${p.xp.toLocaleString('en-US')}<span>XP</span></span>`
        : `<span class="hq-xp">${p.xp.toLocaleString('en-US')}<span>XP</span></span>
           <button type="button" class="hq-cheer${cheeredState[p.name] ? ' is-cheered' : ''}" data-name="${p.name}" aria-label="Cheer for ${p.name}" aria-pressed="${cheeredState[p.name] ? 'true' : 'false'}">
             <i data-lucide="${cheeredState[p.name] ? 'check' : 'zap'}"></i>
           </button>`;
      return `
        <div class="${rowClass}">
          <div class="hq-rank ${topClass}">${p.rank}</div>
          ${avatarTag(p.name)}
          <div class="hq-body">
            <div class="hq-name">${p.name}${nameTag}</div>
            <div class="hq-streak"><i data-lucide="flame"></i>${p.streak}-day streak</div>
          </div>
          <div class="hq-trail">${trail}</div>
        </div>
      `;
    }).join('');
    lucide.createIcons();
  }

  function setRange(isWeek) {
    document.getElementById('segWeek').classList.toggle('is-active', isWeek);
    document.getElementById('segAll').classList.toggle('is-active', !isWeek);
    document.getElementById('segWeek').setAttribute('aria-selected', isWeek);
    document.getElementById('segAll').setAttribute('aria-selected', !isWeek);
    document.getElementById('rangeLabel').textContent = isWeek ? 'Weekly XP' : 'All-time XP';
    document.getElementById('bannerText').innerHTML = isWeek
      ? `You're <strong>35 XP</strong> behind Elliot Raman for #2 this week. One more check-in closes the gap.`
      : `You're <strong>1,450 XP</strong> behind Yuki Vos for #2 all-time. Keep your streaks alive to catch up.`;
    renderList(isWeek ? week : allTime);
  }

  document.getElementById('segWeek').addEventListener('click', () => setRange(true));
  document.getElementById('segAll').addEventListener('click', () => setRange(false));

  document.getElementById('listContainer').addEventListener('click', (e) => {
    const btn = e.target.closest('.hq-cheer');
    if (!btn || btn.classList.contains('is-cheered')) return;
    const name = btn.dataset.name;
    cheeredState[name] = true;
    btn.classList.add('is-cheered');
    btn.setAttribute('aria-pressed', 'true');
    btn.innerHTML = '<i data-lucide="check"></i>';
    lucide.createIcons();
  });

  document.getElementById('inviteBtn').addEventListener('click', () => {
    // Placeholder action — invite flow would open a share sheet.
  });

  setRange(true);
</script>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.47.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons({attrs:{'stroke-width':1.5}})</script></body>
</html>
