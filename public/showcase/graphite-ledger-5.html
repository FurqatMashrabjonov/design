<div class="qa-bar" data-od-id="action-bar">

  <button type="button" class="od-btn od-btn--block" id="saveBtn">Save expense</button>
</div>

<script>
  (function () {
    var valueEl = document.getElementById('amountValue');
    var subEl = document.getElementById('amountSub');
    var saveBtn = document.getElementById('saveBtn');
    var digits = '42.80';

    function render() {
      valueEl.textContent = digits === '' ? '0' : digits;
    }

    // keypad
    document.querySelectorAll('.qa-keypad .qa-key').forEach(function (key) {
      key.addEventListener('click', function () {
        var t = key.textContent.trim();
        if (key.querySelector('i')) {
          digits = digits.slice(0, -1);
          if (digits === '') digits = '0';
          render();
          return;
        }
        if (t === '.') {
          if (digits.indexOf('.') === -1) digits += '.';
          render();
          return;
        }
        if (digits === '0') digits = t;
        else if (digits.indexOf('.') !== -1 && digits.split('.')[1].length >= 2) return;
        else digits += t;
        render();
      });
    });

    // quick picks
    var picks = document.querySelectorAll('.qa-pick');
    picks.forEach(function (p) {
      p.addEventListener('click', function () {
        picks.forEach(function (q) { q.classList.remove('is-active'); });
        p.classList.add('is-active');
        digits = p.getAttribute('data-amount');
        render();
      });
    });

    // expense / income
    var segBtns = document.querySelectorAll('.od-segmented button');
    segBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        segBtns.forEach(function (x) { x.classList.remove('is-active'); });
        b.classList.add('is-active');
        var income = b.getAttribute('data-type') === 'income';
        saveBtn.textContent = income ? 'Save income' : 'Save expense';
        subEl.textContent = income ? 'Income · Acme Co' : 'Meals · Café Lumière';
      });
    });

    render();
  })();
</script>
