      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        var(--accent) 0deg 216deg,
        color-mix(in oklab, var(--accent), var(--surface) 82%) 216deg 360deg
      );
      -webkit-mask: radial-gradient(circle at center, transparent 78px, #000 79px);
      mask: radial-gradient(circle at center, transparent 78px, #000 79px);
    }

    .streak-hero__inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .streak-hero__figure {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: var(--text-3xl);
      line-height: var(--leading-tight);
      letter-spacing: var(--tracking-display);
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }

    .streak-hero__unit {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: var(--text-lg);
      color: var(--fg-2);
      margin-top: var(--space-1);
    }

    .streak-hero__copy {
      margin-top: var(--space-5);
      font-family: var(--font-body);
      font-weight: 500;
      font-size: var(--text-base);
      color: var(--muted);
      text-align: center;
      max-width: 280px;
      line-height: var(--leading-body);
    }

    /* Key facts row: best streak + total completions */
    .facts-row {
      display: flex;
      gap: var(--space-4);
      padding: 0 var(--container-gutter-phone);
      margin-top: var(--space-2);
    }

    .facts-row .od-stat {
      flex: 1;
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .facts-row .od-stat__label {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: var(--text-sm);
      color: var(--muted);
    }

    .facts-row .od-stat__value {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: var(--text-xl);
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      line-height: var(--leading-tight);
    }

    /* Heatmap section */
    .heatmap-section {
      padding: var(--space-6) var(--container-gutter-phone) 0;
    }

    .heatmap-section__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }

    .heatmap-section__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--text-lg);
      color: var(--fg);
      letter-spacing: var(--tracking-display);
    }

    .heatmap-section__link {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: var(--text-sm);
      color: var(--od-accent-text);
      background: none;
      border: none;
      cursor: pointer;
      padding: var(--space-1) 0;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--space-2);
    }

    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--surface);
    }

    .heatmap-cell--filled-1 {
      background: color-mix(in oklab, var(--accent), var(--surface) 78%);
    }

    .heatmap-cell--filled-2 {
      background: color-mix(in oklab, var(--accent), var(--surface) 58%);
    }

    .heatmap-cell--filled-3 {
      background: color-mix(in oklab, var(--accent), var(--surface) 34%);
    }

    .heatmap-cell--filled-4 {
      background: var(--accent);
    }

    .heatmap-cell--today {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .heatmap-legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
      margin-top: var(--space-3);
      font-family: var(--font-body);
      font-weight: 500;
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .heatmap-legend__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* Sticky bottom bar override for detail screen */
    .detail-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: var(--bg);
      padding: var(--space-4) var(--container-gutter-phone) calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: var(--space-4);
      border-top: 1px solid var(--border-soft);
    }

    .detail-bottom-bar .od-btn {
      flex: 1;
      min-height: 52px;
      font-size: var(--text-base);
    }

    .detail-bottom-bar__meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
    }

    .detail-bottom-bar__label {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: var(--text-xs);
      color: var(--muted);
    }

    .detail-bottom-bar__value {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: var(--text-lg);
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      line-height: var(--leading-tight);
    }

    /* A tiny accent sticker moment */
    .ripple-encourage {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin: var(--space-6) var(--container-gutter-phone) 0;
      padding: var(--space-5);
      background: var(--surface-warm);
      border-radius: var(--radius-lg);
    }

    .ripple-encourage__sticker {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .ripple-encourage__text {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: var(--text-base);
      color: var(--fg-2);
      line-height: var(--leading-body);
    }

    .ripple-encourage__text strong {
      font-weight: 700;
      color: var(--fg);
    }
  </style>

  <script>
    // Small interactivity: check-off state
    (function() {
      const btn = document.getElementById('checkoffBtn');
      if (!btn) return;
      let done = false;
      btn.addEventListener('click', function() {
        done = !done;
        if (done) {
          btn.textContent = 'Checked off ✓';
          btn.style.background = 'var(--accent-active)';
          btn.style.color = 'var(--accent-on)';
        } else {
          btn.innerHTML = '<i data-lucide="check" style="width:20px;height:20px;margin-right:8px;"></i> Check off for today';
          btn.style.background = '';
          btn.style.color = '';
        }
        // Re-render any lucide icons inside the button
        if (window.lucide && window.lucide.createIcons) {
          window.lucide.createIcons();
        }
      });
    })();
  </script>
